name: Deployment Monitoring

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to monitor'
        required: true
        type: choice
        options:
        - dev
        - prod
        - all

env:
  REGISTRY: blr.vultrcr.com/mantrapath

jobs:
  monitor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ github.event.inputs.environment == 'all' && fromJson('["dev", "prod"]') || fromJson(format('["{0}"]', github.event.inputs.environment || 'dev')) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/

    - name: Check cluster connectivity
      run: |
        echo "Checking connectivity to ${{ matrix.environment }} cluster..."
        kubectl cluster-info || echo "❌ Cannot connect to cluster"

    - name: Monitor deployment health
      id: health
      run: |
        NAMESPACE="mantrapath-${{ matrix.environment }}"
        RELEASE="mantrapath-${{ matrix.environment }}"
        
        echo "=== Monitoring ${{ matrix.environment }} Environment ==="
        
        # Check if namespace exists
        if ! kubectl get namespace $NAMESPACE >/dev/null 2>&1; then
          echo "❌ Namespace $NAMESPACE does not exist"
          echo "status=namespace_missing" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Check Helm release status
        if ! helm status $RELEASE -n $NAMESPACE >/dev/null 2>&1; then
          echo "❌ Helm release $RELEASE not found"
          echo "status=release_missing" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Get pod status
        PODS=$(kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=$RELEASE -o json)
        TOTAL_PODS=$(echo "$PODS" | jq '.items | length')
        READY_PODS=$(echo "$PODS" | jq '[.items[] | select(.status.conditions[]? | select(.type=="Ready" and .status=="True"))] | length')
        
        echo "Pods: $READY_PODS/$TOTAL_PODS ready"
        
        if [[ $READY_PODS -eq $TOTAL_PODS ]] && [[ $TOTAL_PODS -gt 0 ]]; then
          echo "✅ All pods are healthy"
          echo "status=healthy" >> $GITHUB_OUTPUT
        else
          echo "⚠️  Some pods are not ready"
          echo "status=unhealthy" >> $GITHUB_OUTPUT
          kubectl get pods -n $NAMESPACE -l app.kubernetes.io/instance=$RELEASE
        fi
        
        # Check services
        echo "=== Services ==="
        kubectl get services -n $NAMESPACE -l app.kubernetes.io/instance=$RELEASE
        
        # Check ingress
        echo "=== Ingress ==="
        kubectl get ingress -n $NAMESPACE -l app.kubernetes.io/instance=$RELEASE 2>/dev/null || echo "No ingress found"

    - name: Test application endpoints
      if: steps.health.outputs.status == 'healthy'
      run: |
        echo "Testing application endpoints for ${{ matrix.environment }}..."
        
        NAMESPACE="mantrapath-${{ matrix.environment }}"
        
        # Test API Gateway health endpoint via port-forward
        kubectl port-forward -n $NAMESPACE svc/mantrapath-${{ matrix.environment }}-api-gateway 8080:8000 &
        PF_PID=$!
        sleep 5
        
        if curl -f -s -m 10 "http://localhost:8080/health" >/dev/null 2>&1; then
          echo "✅ API Gateway health check passed"
        else
          echo "❌ API Gateway health check failed"
        fi
        
        kill $PF_PID 2>/dev/null || true

    - name: Check resource usage
      run: |
        NAMESPACE="mantrapath-${{ matrix.environment }}"
        
        echo "=== Resource Usage ==="
        kubectl top pods -n $NAMESPACE 2>/dev/null || echo "Metrics not available"
        kubectl top nodes 2>/dev/null || echo "Node metrics not available"

    - name: Generate monitoring report
      if: always()
      run: |
        cat << EOF > monitoring-report-${{ matrix.environment }}.md
        # Deployment Monitoring Report - ${{ matrix.environment }}
        
        **Date:** $(date -u)
        **Status:** ${{ steps.health.outputs.status || 'unknown' }}
        **Environment:** ${{ matrix.environment }}
        
        ## Pod Status
        \`\`\`
        $(kubectl get pods -n mantrapath-${{ matrix.environment }} -l app.kubernetes.io/instance=mantrapath-${{ matrix.environment }} 2>/dev/null || echo "No pods found")
        \`\`\`
        
        ## Service Status
        \`\`\`
        $(kubectl get services -n mantrapath-${{ matrix.environment }} -l app.kubernetes.io/instance=mantrapath-${{ matrix.environment }} 2>/dev/null || echo "No services found")
        \`\`\`
        
        ## Recent Events
        \`\`\`
        $(kubectl get events -n mantrapath-${{ matrix.environment }} --sort-by='.lastTimestamp' | tail -10 2>/dev/null || echo "No events found")
        \`\`\`
        EOF
        
        echo "Monitoring report generated:"
        cat monitoring-report-${{ matrix.environment }}.md

    - name: Upload monitoring report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: monitoring-report-${{ matrix.environment }}
        path: monitoring-report-${{ matrix.environment }}.md
        retention-days: 7

  alert:
    needs: monitor
    runs-on: ubuntu-latest
    if: always() && contains(needs.monitor.outputs.*, 'unhealthy')
    
    steps:
    - name: Send alert
      run: |
        echo "🚨 ALERT: Unhealthy deployment detected!"
        echo "Check the monitoring reports for details."
        # Add notification logic here (Slack, email, etc.)
