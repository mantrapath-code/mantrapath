name: PR Docker Preview

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-docker-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}
  BRANCH_LATEST: true

jobs:
  detect-changes:
    name: Detect changed services (PR)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute diff range (PR)
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.sha }}"
          BASE_REF="${{ github.base_ref }}"
          git fetch --no-tags --prune --depth=200 origin "$BASE_REF"
          BASE_SHA=$(git merge-base "$HEAD_SHA" "origin/$BASE_REF")
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Determine changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git --no-pager diff --name-only "${{ steps.diff.outputs.BASE_SHA }}" "${{ steps.diff.outputs.HEAD_SHA }}" | tee /tmp/changed_files.txt
          echo "all=$(jq -Rs 'split("\n") | map(select(length>0))' /tmp/changed_files.txt)" >> "$GITHUB_OUTPUT"

      - name: Generate matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          CHANGED_JSON='${{ steps.changed.outputs.all }}'
          echo "$CHANGED_JSON" | jq '.' >/dev/null 2>&1 || CHANGED_JSON='[]'
          mapfile -t CHANGED < <(echo "$CHANGED_JSON" | jq -r '.[]')

          has_shared_change=0
          for f in "${CHANGED[@]}"; do
            if [[ "$f" == backend/shared/* ]] || [[ "$f" == backend/requirements.txt ]] || [[ "$f" == backend/config/* ]] || [[ "$f" == backend/database/* ]]; then
              has_shared_change=1
              break
            fi
          done

          declare -a services=()
          while IFS= read -r -d '' dockerfile; do
            svc_dir=$(basename "$(dirname "$dockerfile")")
            services+=("$svc_dir")
          done < <(find backend/services -mindepth 2 -maxdepth 2 -type f -name Dockerfile -print0 | sort -z)

          if [[ -f frontend/Dockerfile ]]; then
            services+=("frontend")
          fi

          declare -a to_build=()
          if [[ ${#CHANGED[@]} -gt 0 ]]; then
            for svc in "${services[@]}"; do
              if [[ "$svc" == "frontend" ]]; then
                svc_changed=0
                for f in "${CHANGED[@]}"; do
                  if [[ "$f" == frontend/* ]]; then svc_changed=1; break; fi
                done
                [[ $svc_changed -eq 1 ]] && to_build+=("$svc")
                continue
              fi

              svc_path="backend/services/$svc"
              dockerfile_path="$svc_path/Dockerfile"

              if [[ $has_shared_change -eq 1 ]]; then
                to_build+=("$svc")
                continue
              fi

              svc_changed=0
              for f in "${CHANGED[@]}"; do
                if [[ "$f" == "$svc_path"/* ]] || [[ "$f" == "$dockerfile_path" ]]; then svc_changed=1; break; fi
              done
              [[ $svc_changed -eq 1 ]] && to_build+=("$svc")
            done
          fi

          if [[ ${#to_build[@]} -gt 0 ]]; then
            mapfile -t to_build < <(printf '%s\n' "${to_build[@]}" | awk 'NF' | sort -u)
          fi

          json='[]'
          for svc in "${to_build[@]}"; do
            if [[ "$svc" == "frontend" ]]; then
              context="frontend"
              dockerfile="frontend/Dockerfile"
              image_suffix="frontend"
            else
              context="."
              dockerfile="backend/services/$svc/Dockerfile"
              image_suffix="$(echo "$svc" | tr '_' '-')"
            fi
            json=$(echo "$json" | jq --arg name "$svc" --arg context "$context" --arg dockerfile "$dockerfile" --arg suffix "$image_suffix" '. + [{name:$name, context:$context, dockerfile:$dockerfile, image_suffix:$suffix}]')
          done

          count=${#to_build[@]}
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  comment:
    name: Comment on PR with planned images
    needs: detect-changes
    if: needs.detect-changes.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Compose body
        id: body
        shell: bash
        env:
          MATRIX: ${{ needs.detect-changes.outputs.matrix }}
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ env.OWNER }}
          REPO: ${{ env.REPO_NAME }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ github.ref_name }}
          BRANCH_LATEST: ${{ env.BRANCH_LATEST }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MATRIX_JSON="${MATRIX}"
          SHORT_SHA="${SHA:0:7}"
          BRANCH_SAFE=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')
          tmp=$(mktemp)
          {
            echo "Planned Docker images (no push on PRs):"
            echo
            echo "| Service | Image | Tags |"
            echo "|---|---|---|"
          } > "$tmp"

          echo "$MATRIX_JSON" | jq -c '.[]' | while read -r item; do
            name=$(echo "$item" | jq -r '.name')
            suffix=$(echo "$item" | jq -r '.image_suffix')
            image="${REGISTRY}/${OWNER,,}/${REPO}-${suffix}"
            tags=("${SHA}" "${SHORT_SHA}" "${BRANCH_SAFE}")
            if [[ "$BRANCH" == "$DEFAULT_BRANCH" ]]; then
              tags+=("latest")
            else
              if [[ "$BRANCH_LATEST" == "true" || "$BRANCH_LATEST" == "1" ]]; then
                tags+=("latest-${BRANCH_SAFE}")
              fi
            fi
            taglist=$(printf '%s, ' "${tags[@]}" | sed 's/, $//')
            echo "| ${name} | ${image} | ${taglist} |" >> "$tmp"
          done

          body_text=$(cat "$tmp")
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$body_text" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.body.outputs.body }}
