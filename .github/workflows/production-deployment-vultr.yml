name: Production Deployment with Vultr Registry

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deployment/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deployment/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - prod
      force_rebuild:
        description: 'Force rebuild all images'
        required: false
        default: false
        type: boolean
      services:
        description: 'Specific services to deploy (comma-separated, empty for all)'
        required: false
        default: ''
        type: string
      setup_storage:
        description: 'Setup persistent storage'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: blr.vultrcr.com/mantrapath
  REGISTRY_USERNAME: ${{ secrets.VULTR_CR_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.VULTR_CR_PASSWORD }}

jobs:
  # Detect changes to optimize builds
  detect-changes:
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      deployment: ${{ steps.changes.outputs.deployment }}
      any: ${{ steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.deployment == 'true' || github.event.inputs.force_rebuild == 'true' }}
      services_matrix: ${{ steps.services.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for changes
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          backend:
            - 'backend/**'
          frontend:
            - 'frontend/**'
          deployment:
            - 'deployment/**'
            - '.github/workflows/**'

    - name: Determine services to build
      id: services
      run: |
        # All available services with their configurations
        ALL_SERVICES=(
          "api-gateway:backend/services/api_gateway/Dockerfile:backend:mantrapath-api-gateway:8000"
          "frontend:deployment/configs/Dockerfile.frontend:frontend:mantrapath-frontend:3000"
          "translation-service:backend/services/translation_service/Dockerfile:backend:mantrapath-translation-service:8010"
          "models-service:backend/services/models_service/Dockerfile:backend:mantrapath-models-service:8080"
          "auth-service:backend/services/auth_service/Dockerfile:backend:mantrapath-auth-service:8001"
          "chatbot-service:backend/services/chatbot_service/Dockerfile:backend:mantrapath-chatbot-service:8003"
          "voice-service:backend/services/voice_service/Dockerfile:backend:mantrapath-voice-service:8007"
          "ml-service:backend/services/ml_service/Dockerfile:backend:mantrapath-ml-service:8004"
          "mood-service:backend/services/mood_service/Dockerfile:backend:mantrapath-mood-service:8015"
          "profile-service:backend/services/profile_service/Dockerfile:backend:mantrapath-profile-service:8002"
          "content-service:backend/services/content_service/Dockerfile:backend:mantrapath-content-service:8009"
          "community-service:backend/services/community_service/Dockerfile:backend:mantrapath-community-service:8011"
          "notification-service:backend/services/notification_service/Dockerfile:backend:mantrapath-notification-service:8013"
          "memory-service:backend/services/memory_service/Dockerfile:backend:mantrapath-memory-service:8014"
          "media-service:backend/services/media_service/Dockerfile:backend:mantrapath-media-service:8012"
          "ai-context-store:backend/services/ai_context_store/Dockerfile:backend:mantrapath-ai-context-store:8005"
          "ai-event-processor:backend/services/ai_event_processor/Dockerfile:backend:mantrapath-ai-event-processor:8006"
          "action-orchestrator:backend/services/action_orchestrator/Dockerfile:backend:mantrapath-action-orchestrator:8016"
          "voice-event-processor:backend/services/voice_event_processor/Dockerfile:backend:mantrapath-voice-event-processor:8008"
          "proactive-assistance:backend/services/proactive_assistance_engine/Dockerfile:backend:mantrapath-proactive-assistance:8017"
          "deployment-api:backend/services/deployment_api/Dockerfile:backend:mantrapath-deployment-api:8086"
          "phi3-agent:backend/services/phi3_agent/Dockerfile:backend:mantrapath-phi3-agent:8018"
        )
        
        # Build matrix based on input services or changes
        SERVICES_TO_BUILD=()
        
        if [[ -n "${{ github.event.inputs.services }}" ]]; then
          # Manual selection of services
          IFS=',' read -ra SELECTED_SERVICES <<< "${{ github.event.inputs.services }}"
          for service in "${SELECTED_SERVICES[@]}"; do
            service=$(echo "$service" | xargs) # trim whitespace
            for item in "${ALL_SERVICES[@]}"; do
              if [[ "$item" == "$service:"* ]]; then
                SERVICES_TO_BUILD+=("$item")
                break
              fi
            done
          done
        else
          # Build all services if force rebuild or if changes detected
          if [[ "${{ github.event.inputs.force_rebuild }}" == "true" || "${{ steps.changes.outputs.any }}" == "true" ]]; then
            SERVICES_TO_BUILD=("${ALL_SERVICES[@]}")
          fi
        fi
        
        # Convert to JSON matrix format
        MATRIX_SERVICES=""
        for service in "${SERVICES_TO_BUILD[@]}"; do
          IFS=':' read -ra SERVICE_PARTS <<< "$service"
          SERVICE_NAME="${SERVICE_PARTS[0]}"
          DOCKERFILE="${SERVICE_PARTS[1]}"
          CONTEXT="${SERVICE_PARTS[2]}"
          IMAGE="${SERVICE_PARTS[3]}"
          PORT="${SERVICE_PARTS[4]}"
          
          if [[ -n "$MATRIX_SERVICES" ]]; then
            MATRIX_SERVICES="${MATRIX_SERVICES},"
          fi
          MATRIX_SERVICES="${MATRIX_SERVICES}{\"name\":\"${SERVICE_NAME}\",\"dockerfile\":\"${DOCKERFILE}\",\"context\":\"${CONTEXT}\",\"image\":\"${IMAGE}\",\"port\":\"${PORT}\"}"
        done
        
        if [[ -n "$MATRIX_SERVICES" ]]; then
          echo "matrix={\"include\":[${MATRIX_SERVICES}]}" >> $GITHUB_OUTPUT
          echo "✅ Services to build: $(echo "${SERVICES_TO_BUILD[@]}" | sed 's/:[^:]*:[^:]*:[^:]*:[^:]*//g')"
        else
          echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          echo "ℹ️ No services to build"
        fi

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.services_matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Vultr Container Registry
      run: |
        echo "${{ env.REGISTRY_PASSWORD }}" | docker login blr.vultrcr.com -u "${{ env.REGISTRY_USERNAME }}" --password-stdin
        echo "✅ Successfully logged in to Vultr Container Registry"

    - name: Set image tags
      id: tags
      run: |
        IMAGE_NAME="${{ env.REGISTRY }}/${{ matrix.image }}"
        TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:${{ github.sha }}"
        
        # Add environment-specific tags
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          TAGS="${TAGS},${IMAGE_NAME}:prod,${IMAGE_NAME}:stable"
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          TAGS="${TAGS},${IMAGE_NAME}:dev,${IMAGE_NAME}:staging"
        fi
        
        # Add timestamp tag for tracking
        TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
        TAGS="${TAGS},${IMAGE_NAME}:${TIMESTAMP}"
        
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT
        echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
        echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

    - name: Verify Dockerfile exists
      run: |
        DOCKERFILE_PATH="${{ matrix.dockerfile }}"
        
        if [[ ! -f "$DOCKERFILE_PATH" ]]; then
          echo "❌ Dockerfile not found: $DOCKERFILE_PATH"
          echo "Available files in directory:"
          find "$(dirname "$DOCKERFILE_PATH")" -name "Dockerfile*" -o -name "*.dockerfile" 2>/dev/null || echo "No Dockerfiles found"
          exit 1
        else
          echo "✅ Dockerfile found: $DOCKERFILE_PATH"
          echo "Dockerfile content preview:"
          head -10 "$DOCKERFILE_PATH"
        fi

    - name: Build Docker image
      run: |
        cd ${{ matrix.context }}
        DOCKERFILE_PATH="../${{ matrix.dockerfile }}"
        
        echo "🔨 Building ${{ matrix.name }} from context: $(pwd)"
        echo "📁 Using Dockerfile: $DOCKERFILE_PATH"
        
        # Build with detailed output
        docker build \
          -f "$DOCKERFILE_PATH" \
          -t temp-${{ matrix.image }}:latest \
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
          --label "org.opencontainers.image.revision=${{ github.sha }}" \
          --label "org.opencontainers.image.created=$(date -u --iso-8601=seconds)" \
          --label "mantrapath.service=${{ matrix.name }}" \
          --label "mantrapath.port=${{ matrix.port }}" \
          .
        
        echo "✅ Successfully built ${{ matrix.name }}"
        
    - name: Tag and push Docker images
      run: |
        # Parse tags and tag all variants
        IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
        
        echo "🏷️ Tagging images..."
        for tag in "${TAG_ARRAY[@]}"; do
          echo "  Tagging: temp-${{ matrix.image }}:latest -> $tag"
          docker tag temp-${{ matrix.image }}:latest "$tag"
        done
        
        echo "📤 Pushing images to Vultr Container Registry..."
        for tag in "${TAG_ARRAY[@]}"; do
          echo "  Pushing: $tag"
          docker push "$tag"
        done
        
        # Clean up temp image
        docker rmi temp-${{ matrix.image }}:latest || true
        
        echo "✅ Successfully pushed ${{ matrix.image }} with ${#TAG_ARRAY[@]} tags"

    - name: Image security scan (optional)
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🔍 Running security scan for production images..."
        # Add your preferred security scanning tool here
        # Example: trivy image ${{ steps.tags.outputs.image_name }}:latest
        echo "Security scan completed (placeholder)"

  setup-persistent-storage:
    needs: detect-changes
    if: github.event.inputs.setup_storage == 'true' || github.event.inputs.setup_storage == ''
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "environment=prod" >> $GITHUB_OUTPUT
          echo "namespace=mantrapath-prod" >> $GITHUB_OUTPUT
        else
          echo "environment=dev" >> $GITHUB_OUTPUT
          echo "namespace=mantrapath-dev" >> $GITHUB_OUTPUT
        fi

    - name: Create namespace
      run: |
        kubectl create namespace ${{ steps.vars.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
        echo "✅ Namespace ${{ steps.vars.outputs.namespace }} ready"

    - name: Setup storage class for Vultr
      run: |
        cat << EOF | kubectl apply -f -
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: vultr-block-storage-hdd
        provisioner: block.csi.vultr.com
        parameters:
          type: "hdd"
        allowVolumeExpansion: true
        volumeBindingMode: WaitForFirstConsumer
        EOF
        echo "✅ Storage class configured for Vultr"

    - name: Apply persistent volume configurations
      run: |
        cd deployment/helm/mantrapath
        
        # Create persistent volumes using Helm templates
        helm template mantrapath-storage . \
          --values values-complete.yaml \
          --set global.env="${{ steps.vars.outputs.environment }}" \
          --set global.namespace="${{ steps.vars.outputs.namespace }}" \
          --set persistence.enabled=true \
          --show-only templates/persistent-volumes.yaml | \
          kubectl apply -f -
        
        echo "✅ Persistent volumes configured"

    - name: Wait for storage initialization
      run: |
        echo "⏳ Waiting for storage initialization job..."
        kubectl wait --for=condition=complete job/mantrapath-${{ steps.vars.outputs.environment }}-init-storage \
          -n ${{ steps.vars.outputs.namespace }} --timeout=300s || \
          echo "⚠️ Storage init job may still be running"
        
        echo "📊 Storage status:"
        kubectl get pvc -n ${{ steps.vars.outputs.namespace }}

  deploy:
    needs: [detect-changes, build-and-push, setup-persistent-storage]
    runs-on: self-hosted
    if: always() && (needs.build-and-push.result == 'success' || needs.detect-changes.outputs.deployment == 'true') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch')
    
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set deployment variables
      id: vars
      run: |
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "environment=prod" >> $GITHUB_OUTPUT
          echo "values_file=values-complete.yaml" >> $GITHUB_OUTPUT
          echo "namespace=mantrapath-prod" >> $GITHUB_OUTPUT
        else
          echo "environment=dev" >> $GITHUB_OUTPUT
          echo "values_file=values-complete.yaml" >> $GITHUB_OUTPUT
          echo "namespace=mantrapath-dev" >> $GITHUB_OUTPUT
        fi

    - name: Validate Helm charts
      run: |
        cd deployment/helm/mantrapath
        
        echo "🔍 Updating Helm dependencies..."
        helm dependency update
        
        echo "🔍 Linting Helm charts..."
        helm lint . --values ${{ steps.vars.outputs.values_file }} --strict
        
        echo "✅ Helm charts validation completed"

    - name: Create Docker registry secret
      run: |
        kubectl create namespace ${{ steps.vars.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -
        
        # Create/update registry secret for Vultr
        kubectl create secret docker-registry mantrapath-registry \
          --namespace=${{ steps.vars.outputs.namespace }} \
          --docker-server=blr.vultrcr.com \
          --docker-username="${{ env.REGISTRY_USERNAME }}" \
          --docker-password="${{ env.REGISTRY_PASSWORD }}" \
          --dry-run=client -o yaml | kubectl apply -f -
        
        echo "✅ Registry secret configured"

    - name: Deploy with Helm
      id: deploy
      run: |
        cd deployment/helm/mantrapath
        
        echo "🚀 Deploying MantraPath to ${{ steps.vars.outputs.environment }}..."
        
        # Deploy using Helm with persistent storage
        helm upgrade --install mantrapath-${{ steps.vars.outputs.environment }} . \
          --namespace ${{ steps.vars.outputs.namespace }} \
          --values ${{ steps.vars.outputs.values_file }} \
          --set global.registry=${{ env.REGISTRY }} \
          --set global.imagePullSecrets[0].name=mantrapath-registry \
          --set global.env=${{ steps.vars.outputs.environment }} \
          --set global.namespace=${{ steps.vars.outputs.namespace }} \
          --set persistence.enabled=true \
          --set-string global.labels.deployment-id=${{ github.sha }} \
          --set-string global.labels.build-number=${{ github.run_number }} \
          --set-string global.labels.registry-url="${{ env.REGISTRY }}" \
          --set-string global.labels.deployment-timestamp="$(date -u --iso-8601=seconds)" \
          --timeout 20m \
          --wait \
          --atomic
        
        echo "✅ Deployment completed successfully!"
        echo "📦 All images pulled from: ${{ env.REGISTRY }}"
        
        # Set deployment URL
        if [[ "${{ steps.vars.outputs.environment }}" == "dev" ]]; then
          echo "url=http://localhost:30880" >> $GITHUB_OUTPUT
        else
          echo "url=https://mantrapath.com" >> $GITHUB_OUTPUT
        fi

    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        
        echo "📊 Pod Status:"
        kubectl get pods -n ${{ steps.vars.outputs.namespace }} -l app.kubernetes.io/instance=mantrapath-${{ steps.vars.outputs.environment }}
        
        echo "🌐 Service Status:"
        kubectl get services -n ${{ steps.vars.outputs.namespace }} -l app.kubernetes.io/instance=mantrapath-${{ steps.vars.outputs.environment }}
        
        echo "💾 Storage Status:"
        kubectl get pvc -n ${{ steps.vars.outputs.namespace }}
        
        echo "⏳ Waiting for pods to be ready..."
        kubectl wait --for=condition=ready pod \
          -l app.kubernetes.io/instance=mantrapath-${{ steps.vars.outputs.environment }} \
          -n ${{ steps.vars.outputs.namespace }} \
          --timeout=600s || echo "⚠️ Some pods may still be starting"
        
        echo "✅ Deployment verification completed"

    - name: Run comprehensive health checks
      run: |
        echo "🏥 Running comprehensive health checks..."
        
        # Test persistent storage
        echo "💾 Testing persistent storage..."
        cat << 'EOF' | kubectl apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: storage-test-${{ github.run_number }}
          namespace: ${{ steps.vars.outputs.namespace }}
        spec:
          containers:
          - name: test
            image: busybox:latest
            command: ["sh", "-c", "echo 'Storage test at $(date)' > /data/test-${{ github.run_number }}.txt && cat /data/test-${{ github.run_number }}.txt && sleep 60"]
            volumeMounts:
            - name: app-data
              mountPath: /data
          volumes:
          - name: app-data
            persistentVolumeClaim:
              claimName: mantrapath-${{ steps.vars.outputs.environment }}-app-data-pvc
          restartPolicy: Never
        EOF
        
        # Wait for storage test
        kubectl wait --for=condition=ready pod/storage-test-${{ github.run_number }} -n ${{ steps.vars.outputs.namespace }} --timeout=60s || true
        kubectl logs storage-test-${{ github.run_number }} -n ${{ steps.vars.outputs.namespace }} || echo "Storage test pending..."
        kubectl delete pod storage-test-${{ github.run_number }} -n ${{ steps.vars.outputs.namespace }} --ignore-not-found
        
        # Test critical services
        CRITICAL_SERVICES=("api-gateway" "models-service" "frontend")
        
        for service in "${CRITICAL_SERVICES[@]}"; do
          echo "🔍 Checking $service..."
          POD_NAME=$(kubectl get pods -n ${{ steps.vars.outputs.namespace }} -l component=$service -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          
          if [[ -n "$POD_NAME" ]]; then
            kubectl get pod "$POD_NAME" -n ${{ steps.vars.outputs.namespace }}
            echo "✅ $service is running"
          else
            echo "⚠️ $service pod not found or not ready yet"
          fi
        done
        
        echo "🏥 Health checks completed"

    - name: Generate deployment summary
      if: always()
      run: |
        echo "# 🚀 MantraPath Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** ${{ steps.vars.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "**Namespace:** ${{ steps.vars.outputs.namespace }}" >> $GITHUB_STEP_SUMMARY
        echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Build:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "**Runner:** self-hosted" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ job.status }}" == "success" ]]; then
          echo "✅ **Status:** Deployment successful!" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "💾 **Persistent Storage:** Enabled" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Status:** Deployment failed!" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📊 Deployment Metrics" >> $GITHUB_STEP_SUMMARY
        
        POD_COUNT=$(kubectl get pods -n ${{ steps.vars.outputs.namespace }} --no-headers 2>/dev/null | wc -l || echo "0")
        READY_PODS=$(kubectl get pods -n ${{ steps.vars.outputs.namespace }} --no-headers 2>/dev/null | grep -c "Running" || echo "0")
        PVC_COUNT=$(kubectl get pvc -n ${{ steps.vars.outputs.namespace }} --no-headers 2>/dev/null | wc -l || echo "0")
        
        echo "**Total Pods:** $POD_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "**Ready Pods:** $READY_PODS" >> $GITHUB_STEP_SUMMARY
        echo "**Persistent Volumes:** $PVC_COUNT" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🔗 Management Commands" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "# View pods" >> $GITHUB_STEP_SUMMARY
        echo "kubectl get pods -n ${{ steps.vars.outputs.namespace }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# View services" >> $GITHUB_STEP_SUMMARY
        echo "kubectl get services -n ${{ steps.vars.outputs.namespace }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# View storage" >> $GITHUB_STEP_SUMMARY
        echo "kubectl get pvc -n ${{ steps.vars.outputs.namespace }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# View logs" >> $GITHUB_STEP_SUMMARY
        echo "kubectl logs -f deployment/mantrapath-${{ steps.vars.outputs.environment }}-api-gateway -n ${{ steps.vars.outputs.namespace }}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  notify:
    needs: [detect-changes, build-and-push, setup-persistent-storage, deploy]
    runs-on: self-hosted
    if: always()
    
    steps:
    - name: Final deployment notification
      run: |
        echo "🎯 MantraPath Deployment Pipeline Summary"
        echo "========================================"
        echo "Environment: ${{ needs.deploy.outputs.environment || 'Unknown' }}"
        echo "Registry: ${{ env.REGISTRY }}"
        echo "Runner: self-hosted"
        echo "Timestamp: $(date -u --iso-8601=seconds)"
        echo ""
        
        if [[ "${{ needs.deploy.result }}" == "success" ]]; then
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "✅ All services deployed with persistent storage"
          echo "✅ All images pulled from Vultr Container Registry"
          echo "🌐 Application is ready and running"
        elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
          echo "❌ DEPLOYMENT FAILED!"
          echo "Please check the logs above for detailed error information."
        else
          echo "ℹ️ Deployment was skipped or cancelled."
        fi
        
        echo ""
        echo "🔗 Quick Links:"
        echo "- Vultr Registry: https://blr.vultrcr.com/mantrapath"
        echo "- Kubernetes Dashboard: kubectl proxy"
        echo "- Application Logs: kubectl logs -f deployment/mantrapath-api-gateway"
