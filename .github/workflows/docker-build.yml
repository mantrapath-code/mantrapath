name: Docker Image Build (Selective)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      force_service:
        description: "Optional service directory name under backend/services to force-build (e.g., api_gateway)"
        required: false
        type: string
      build_all:
        description: "If true, build all services regardless of changes"
        required: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}
  BRANCH_LATEST: true

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches
        run: |
          git fetch --no-tags --prune --depth=200 origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Compute diff range
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"
          HEAD_SHA="${{ github.sha }}"

          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch --no-tags --prune --depth=200 origin "$BASE_REF"
            BASE_SHA=$(git merge-base "$HEAD_SHA" "origin/$BASE_REF")
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$BEFORE_SHA"
            else
              # Fallback to merge-base with default branch
              DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
              git fetch --no-tags --prune --depth=200 origin "$DEFAULT_BRANCH"
              BASE_SHA=$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH")
            fi
          fi

          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Determine changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git --no-pager diff --name-only "${{ steps.diff.outputs.BASE_SHA }}" "${{ steps.diff.outputs.HEAD_SHA }}" | tee /tmp/changed_files.txt
          echo "all=$(jq -c -Rs 'split("\n") | map(select(length>0))' /tmp/changed_files.txt)" >> "$GITHUB_OUTPUT"

      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          FORCE_SERVICE="${{ inputs.force_service }}"
          BUILD_ALL="${{ inputs.build_all }}"
          CHANGED_JSON='${{ steps.changed.outputs.all }}'
          echo "$CHANGED_JSON" | jq '.' >/dev/null 2>&1 || CHANGED_JSON='[]'

          # Convert JSON array back to newline list for easy matching
          mapfile -t CHANGED < <(echo "$CHANGED_JSON" | jq -r '.[]')

          has_shared_change=0
          for f in "${CHANGED[@]}"; do
            if [[ "$f" == backend/shared/* ]] || [[ "$f" == backend/requirements.txt ]] || [[ "$f" == backend/config/* ]] || [[ "$f" == backend/database/* ]]; then
              has_shared_change=1
              break
            fi
          done

          # Discover services with a Dockerfile
          declare -a services=()
          while IFS= read -r -d '' dockerfile; do
            svc_dir=$(basename "$(dirname "$dockerfile")")
            services+=("$svc_dir")
          done < <(find backend/services -mindepth 2 -maxdepth 2 -type f -name Dockerfile -print0 | sort -z)

          # Deduplicate service names in case of any path duplicates
          if [[ ${#services[@]} -gt 0 ]]; then
          mapfile -t services < <(printf '%s\n' "${services[@]}" | awk 'NF' | sort -u)
          fi

          # Optionally include frontend if Dockerfile exists
          if [[ -f frontend/Dockerfile ]]; then
            services+=("frontend")
          fi

          declare -a to_build=()

          if [[ "$BUILD_ALL" == "true" || "$BUILD_ALL" == "1" ]]; then
            to_build=("${services[@]}")
          elif [[ -n "$FORCE_SERVICE" ]]; then
            to_build+=("$FORCE_SERVICE")
          elif [[ ${#CHANGED[@]} -eq 0 ]]; then
            to_build=()
          else
            for svc in "${services[@]}"; do
              if [[ "$svc" == "frontend" ]]; then
                # frontend changes
                svc_changed=0
                for f in "${CHANGED[@]}"; do
                  if [[ "$f" == frontend/* ]]; then svc_changed=1; break; fi
                done
                [[ $svc_changed -eq 1 ]] && to_build+=("$svc")
                continue
              fi

              svc_path="backend/services/$svc"
              dockerfile_path="$svc_path/Dockerfile"

              if [[ $has_shared_change -eq 1 ]]; then
                to_build+=("$svc")
                continue
              fi

              svc_changed=0
              for f in "${CHANGED[@]}"; do
                if [[ "$f" == "$svc_path"/* ]] || [[ "$f" == "$dockerfile_path" ]]; then svc_changed=1; break; fi
              done
              [[ $svc_changed -eq 1 ]] && to_build+=("$svc")
            done
          fi

          # De-duplicate
          if [[ ${#to_build[@]} -gt 0 ]]; then
            mapfile -t to_build < <(printf '%s\n' "${to_build[@]}" | awk 'NF' | sort -u)
          fi

          # Build JSON matrix entries: name, context, dockerfile, image_suffix
          default_branch='${{ github.event.repository.default_branch }}'

          json='[]'
          for svc in "${to_build[@]}"; do
            if [[ "$svc" == "frontend" ]]; then
              context="frontend"
              dockerfile="frontend/Dockerfile"
              image_suffix="frontend"
            else
              context="backend"
              # Use lightweight Dockerfile for models_service to avoid disk space issues
              if [[ "$svc" == "models_service" ]]; then
                dockerfile="backend/services/$svc/Dockerfile.light"
              else
                dockerfile="backend/services/$svc/Dockerfile"
              fi
              image_suffix="$(echo "$svc" | tr '_' '-')"
            fi
            json=$(echo "$json" | jq --arg name "$svc" --arg context "$context" --arg dockerfile "$dockerfile" --arg suffix "$image_suffix" '. + [{name:$name, context:$context, dockerfile:$dockerfile, image_suffix:$suffix}]')
          done

          count=${#to_build[@]}
          json_compact=$(echo "$json" | jq -c '.')
          echo "matrix=$json_compact" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Services to build: $count"
          echo "$json_compact" | jq -C .

  build:
    name: Build and push images
    needs: detect-changes
    if: needs.detect-changes.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Free up disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h
          
          # Remove unnecessary software to free up disk space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Clean up docker system
          docker system prune -af --volumes || true
          
          echo "Disk usage after cleanup:"
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          OWNER='${{ env.OWNER }}'
          IMAGE="${OWNER,,}/${{ env.REPO_NAME }}-${{ matrix.image_suffix }}"
          IMAGE="${IMAGE,,}"

          SHA_TAG="${{ github.sha }}"
          SHORT_SHA="${SHA_TAG:0:7}"
          BRANCH='${{ github.ref_name }}'
          BRANCH_SAFE=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')

          TAGS=(
            "${{ env.REGISTRY }}/$IMAGE:${SHA_TAG}"
            "${{ env.REGISTRY }}/$IMAGE:${SHORT_SHA}"
            "${{ env.REGISTRY }}/$IMAGE:${BRANCH_SAFE}"
          )

          if [[ "$BRANCH" == "$DEFAULT_BRANCH" ]]; then
            TAGS+=("${{ env.REGISTRY }}/$IMAGE:latest")
          else
            if [[ "${{ env.BRANCH_LATEST }}" == "true" || "${{ env.BRANCH_LATEST }}" == "1" ]]; then
              TAGS+=("${{ env.REGISTRY }}/$IMAGE:latest-${BRANCH_SAFE}")
            fi
          fi

          printf '%s\n' "${TAGS[@]}" | tee /tmp/tags.txt
          {
            echo 'tags<<EOF'
            cat /tmp/tags.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }} (AMD64 only for frontend)
        uses: docker/build-push-action@v6
        if: matrix.name == 'frontend'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=mantrapath-${{ matrix.image_suffix }}
          cache-to: type=gha,mode=max,scope=mantrapath-${{ matrix.image_suffix }},ignore-error=true
          provenance: false
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true

      - name: Build and push ${{ matrix.name }} (Multi-platform for backend)
        uses: docker/build-push-action@v6
        if: matrix.name != 'frontend'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=mantrapath-${{ matrix.image_suffix }}
          cache-to: type=gha,mode=max,scope=mantrapath-${{ matrix.image_suffix }},ignore-error=true
          provenance: false
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true

  deploy:
    name: Deploy changed services to Kubernetes
    needs: [detect-changes, build]
    if: github.event_name != 'pull_request' && needs.detect-changes.outputs.count != '0'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'mantrapath' }}
      DEPLOY_TAG_STRATEGY: ${{ vars.DEPLOY_TAG_STRATEGY || 'sha' }}
      WAIT_ROLLOUT: ${{ vars.WAIT_ROLLOUT || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        id: kubeconfig
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KUBE_CONFIG_B64:-}" ]]; then
            echo "Kubeconfig secret KUBE_CONFIG_B64 not provided; skipping deploy." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 'Optional: ensure imagePullSecret for GHCR'
        if: steps.kubeconfig.outputs.skip == 'false'
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${REGISTRY_USERNAME:-}" && -n "${REGISTRY_PASSWORD:-}" ]]; then
            kubectl -n "$NAMESPACE" create secret docker-registry ghcr-creds \
              --docker-server=ghcr.io \
              --docker-username="$REGISTRY_USERNAME" \
              --docker-password="$REGISTRY_PASSWORD" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "Registry credentials not provided; assuming public images or preconfigured pull secret."
          fi

      - name: Deploy changed services
        if: steps.kubeconfig.outputs.skip == 'false'
        shell: bash
        env:
          MATRIX: ${{ needs.detect-changes.outputs.matrix }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ -z "$MATRIX" || "$MATRIX" == "[]" ]]; then
            echo "No services to deploy"; exit 0
          fi

          SHORT_SHA="${SHA:0:7}"
          BRANCH_SAFE=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')

          choose_tag() {
            case "$DEPLOY_TAG_STRATEGY" in
              sha) echo "$SHA";;
              short-sha) echo "$SHORT_SHA";;
              branch) echo "$BRANCH_SAFE";;
              latest) echo "latest";;
              latest-branch) echo "latest-$BRANCH_SAFE";;
              *) echo "$SHA";;
            esac
          }

          TAG=$(choose_tag)
          echo "Deploy tag strategy: $DEPLOY_TAG_STRATEGY -> $TAG"

          echo "$MATRIX" | jq -c '.[]' | while read -r item; do
            name=$(echo "$item" | jq -r '.name')
            suffix=$(echo "$item" | jq -r '.image_suffix')
            image="${REGISTRY}/${OWNER_LC}/${REPO}-${suffix}:${TAG}"

            # Assumptions: Deployment and container names match the image suffix
            deploy_name="$suffix"
            container_name="$suffix"

            echo "Updating $deploy_name -> $image"
            if kubectl -n "$NAMESPACE" get deploy "$deploy_name" >/dev/null 2>&1; then
              kubectl -n "$NAMESPACE" set image deploy/"$deploy_name" "$container_name"="$image" --record=false
              if [[ "$WAIT_ROLLOUT" == "true" || "$WAIT_ROLLOUT" == "1" ]]; then
                kubectl -n "$NAMESPACE" rollout status deploy/"$deploy_name" --timeout=180s || {
                  echo "Rollout failed for $deploy_name" >&2; exit 1; }
              fi
            else
              echo "Deployment $deploy_name not found in namespace $NAMESPACE; skipping."
            fi
          done
