name: Build & Push Single Service

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Backend service folder name (e.g., api_gateway)'
        required: true
        type: string
      push_latest:
        description: 'Also push :latest tag'
        required: false
        default: 'true'
        type: choice
        options: [ 'true', 'false' ]
      extra_tags:
        description: 'Comma-separated extra tags (optional)'
        required: false
        default: ''
        type: string

env:
  VULTR_REGISTRY: ${{ secrets.VULTR_REGISTRY || 'blr.vultrcr.com/mantrapath' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate inputs
        run: |
          if [[ -z "${{ github.event.inputs.service }}" ]]; then
            echo "No service provided" >&2; exit 1;
          fi
          if [[ ! -f "backend/services/${{ github.event.inputs.service }}/Dockerfile" ]]; then
            echo "Dockerfile not found for service '${{ github.event.inputs.service }}'" >&2; exit 1;
          fi

      - name: Build & Push service to Vultr
        env:
          VULTR_REGISTRY: ${{ env.VULTR_REGISTRY }}
          VULTR_REGISTRY_USERNAME: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          VULTR_REGISTRY_PASSWORD: ${{ secrets.VULTR_REGISTRY_PASSWORD }}
          PUSH_LATEST: ${{ github.event.inputs.push_latest }}
          EXTRA_TAGS: ${{ github.event.inputs.extra_tags }}
        run: |
          chmod +x ci/build-push-service.sh
          ./ci/build-push-service.sh "${{ github.event.inputs.service }}"

      - name: Summary
        run: |
          echo "### ✅ Built and pushed '${{ github.event.inputs.service }}'" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: ${{ env.VULTR_REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: :${{ github.sha }}${{ github.event.inputs.push_latest == 'true' && ', :latest' || '' }}" >> $GITHUB_STEP_SUMMARY
