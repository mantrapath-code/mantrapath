# NATS Server Configuration for MantraPath V3
# Optimized for real-time voice, AI, and cultural intelligence events

# Server settings
server_name: "mantrapath-nats-v3"
host: "0.0.0.0"
port: 4222

# HTTP monitoring
http_port: 8222
http: "0.0.0.0:8222"

# Clustering (for future scaling)
cluster {
  name: "mantrapath-cluster"
  host: "0.0.0.0"
  port: 6222
  routes = [
    "nats://nats:6222"
  ]
}

# JetStream configuration for persistence and replay
jetstream {
  store_dir: "/tmp/mantrapath-jetstream"
  
  # Memory settings
  max_memory_store: 1GB
  max_file_store: 10GB
  
  # Domain for multi-tenant support
  domain: "mantrapath"
}

# Limits for performance
max_connections: 1000
max_subscriptions: 5000
max_payload: 8MB
max_pending: 128MB
max_control_line: 4096

# Authentication (can be enabled for production)
# accounts {
#   mantrapath {
#     users = [
#       { user: "mantrapath_user", password: "secure_password" }
#     ]
#   }
# }

# Logging
log_file: "/tmp/nats-server.log"
log_size_limit: 100MB
debug: false
trace: false
logtime: true

# TLS (disabled for development, enable for production)
# tls {
#   cert_file: "/etc/ssl/certs/nats.crt"
#   key_file: "/etc/ssl/private/nats.key"
#   timeout: 5
# }

# Write deadline for slow consumers
write_deadline: "10s"

# Ping settings
ping_interval: "2m"
ping_max: 2

# Connection timeouts
# These are optimized for real-time voice processing
connect_error_reports: 1
reconnect_error_reports: 1
