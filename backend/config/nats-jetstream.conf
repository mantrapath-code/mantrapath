# NATS Server Configuration for MantraPath - Single Instance
# Simple, working configuration with JetStream enabled

# Server Settings
server_name: "mantrapath-nats"
host: "0.0.0.0"
port: 4222

# HTTP Monitoring
http_port: 8222
http: "0.0.0.0:8222"

# JetStream Configuration  
jetstream {
    store_dir: "/data/jetstream"
    max_memory_store: 268435456
    max_file_store: 1073741824
}

# Logging
logtime: true
debug: false

# Connection Limits
max_connections: 1000
max_payload: 1048576
max_pending: 67108864

