[tool:pytest]
minversion = 6.0
addopts = -ra -q --strict-markers --strict-config --cov=engines --cov=models --cov=main --cov=config --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=80
testpaths = tests test_comprehensive
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Async tests
    api: API endpoint tests
    engine: Translation engine tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

[tool:coverage.run]
source = engines,models,main,config
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    */.pytest_cache/*
branch = true

[tool:coverage.report]
exclude_lines = 
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
show_missing = true
precision = 2

[tool:coverage.html]
directory = "htmlcov"
