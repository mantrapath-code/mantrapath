version: '3.8'

services:
  translation-service:
    build: .
    container_name: mantrapath-translation-service
    ports:
      - "8010:8010"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://mantrapath:mantrapath@db:5432/mantrapath
      - REDIS_URL=redis://redis:6379/0
      - SERVICE_PORT=8010
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
      - MICROSOFT_TRANSLATOR_API_KEY=${MICROSOFT_TRANSLATOR_API_KEY:-}
      - MICROSOFT_TRANSLATOR_REGION=${MICROSOFT_TRANSLATOR_REGION:-global}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOCAL_MODEL_ENABLED=true
      - CULTURAL_ADAPTATION_ENABLED=true
      - PROMETHEUS_ENABLED=true
      - METRICS_PORT=8010
      - LOG_LEVEL=info
    depends_on:
      - db
      - redis
    networks:
      - mantrapath-network
    restart: unless-stopped
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: mantrapath-translation-db
    environment:
      POSTGRES_DB: mantrapath
      POSTGRES_USER: mantrapath
      POSTGRES_PASSWORD: mantrapath
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mantrapath-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mantrapath-translation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mantrapath-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: mantrapath-translation-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - mantrapath-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  mantrapath-network:
    driver: bridge
