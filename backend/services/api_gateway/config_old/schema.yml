# Gateway Configuration Schema
# This file defines the structure and validation rules for gateway configuration

gateway:
  environment: development | staging | production
  debug: boolean
  host: string (IP address)
  port: integer (1-65535)
  
cors:
  origins: array of strings (URLs)
  credentials: boolean
  methods: array of strings (HTTP methods)
  headers: array of strings
  
rate_limiting:
  enabled: boolean
  requests_per_minute: integer
  burst: integer
  
load_balancing:
  strategy: round_robin | weighted | least_connections | random
  
health_checks:
  interval: integer (seconds)
  timeout: integer (seconds)
  retries: integer
  
circuit_breaker:
  enabled: boolean
  failure_threshold: integer
  recovery_timeout: integer (seconds)
  
redis:
  url: string (Redis connection URL)
  ttl: integer (seconds)
  
security:
  jwt_secret_key: string
  jwt_algorithm: string
  jwt_expiration: integer (seconds)
  
logging:
  level: DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: string
  
monitoring:
  metrics_enabled: boolean
  metrics_port: integer
  
services:
  [service_name]:
    url: string (service URL)
    health_path: string (health check endpoint)
    timeout: integer (seconds)
    retries: integer
    weight: integer (for load balancing)
