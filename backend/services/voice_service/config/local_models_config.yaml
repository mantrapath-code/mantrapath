# Local Voice Models Configuration
voice_engines:
  # Speech-to-Text Engines (in priority order)
  stt_engines:
    - name: "whisper_local"
      priority: 1
      enabled: true
      type: "local"
      config:
        model_size: "medium"  # tiny, base, small, medium, large, large-v2, large-v3
        device: "auto"        # auto, cpu, cuda
        use_faster_whisper: true
        compute_type: "float16"  # float16, float32, int8
        beam_size: 5
        temperature: 0.0
        
    - name: "vosk"
      priority: 2
      enabled: true
      type: "local"
      config:
        model_path: "./models/vosk"
        sample_rate: 16000
        language: "en"
        model_paths:
          en: "./models/vosk/vosk-model-en-us-0.22"
          es: "./models/vosk/vosk-model-es-0.42"
          fr: "./models/vosk/vosk-model-fr-0.39"
          de: "./models/vosk/vosk-model-de-0.21"
          ru: "./models/vosk/vosk-model-ru-0.42"
          zh: "./models/vosk/vosk-model-cn-0.22"
    
    - name: "whisper_api"
      priority: 3
      enabled: true
      type: "api"
      config:
        api_key: "${OPENAI_API_KEY}"
        model: "whisper-1"
        
  # Text-to-Speech Engines (in priority order)
  tts_engines:
    - name: "coqui_local"
      priority: 1
      enabled: true
      type: "local"
      config:
        model_name: "tts_models/multilingual/multi-dataset/xtts_v2"
        device: "auto"        # auto, cpu, cuda
        use_cuda: true
        sample_rate: 22050
        default_speaker: "Claribel Dervla"
        speaker_wav_path: null  # For voice cloning
        
    - name: "festival"
      priority: 2
      enabled: true
      type: "local"
      config:
        voice: "default"
        sample_rate: 16000
        voices:
          en: "voice_kal_diphone"
          es: "voice_el_diphone"
          fr: "voice_fr_diphone"
    
    - name: "espeak"
      priority: 3
      enabled: true
      type: "local"
      config:
        voice: "default"
        speed: 175
        pitch: 50
        amplitude: 100
        
    - name: "elevenlabs_api"
      priority: 4
      enabled: true
      type: "api"
      config:
        api_key: "${ELEVENLABS_API_KEY}"
        voice_id: "21m00Tcm4TlvDq8ikWAM"

# Model Storage Configuration
storage:
  models_directory: "./models"
  cache_directory: "./cache"
  temp_directory: "./temp"
  max_cache_size_gb: 10
  cleanup_interval_hours: 24

# Performance Configuration
performance:
  # GPU Configuration
  gpu:
    enabled: true
    memory_limit_gb: 12
    allow_growth: true
    fallback_to_cpu: true
    
  # CPU Configuration  
  cpu:
    max_threads: 8
    thread_pool_size: 4
    
  # Memory Management
  memory:
    max_model_memory_gb: 16
    model_unload_timeout_min: 30
    preload_models: ["whisper_medium", "coqui_xtts"]

# Quality Configuration
quality:
  # STT Quality Settings
  stt:
    min_confidence: 0.7
    enable_post_processing: true
    noise_reduction: true
    
  # TTS Quality Settings
  tts:
    sample_rate: 22050
    channels: 1
    bit_depth: 16
    enable_enhancement: true

# Language Support
languages:
  supported:
    - code: "en"
      name: "English"
      whisper: true
      vosk: true
      coqui: true
      festival: true
      espeak: true
      
    - code: "es" 
      name: "Spanish"
      whisper: true
      vosk: true
      coqui: true
      festival: true
      espeak: true
      
    - code: "fr"
      name: "French"
      whisper: true
      vosk: true
      coqui: true
      festival: true
      espeak: true
      
    - code: "de"
      name: "German"
      whisper: true
      vosk: true
      coqui: true
      festival: false
      espeak: true
      
    - code: "hi"
      name: "Hindi"
      whisper: true
      vosk: false
      coqui: true
      festival: false
      espeak: true
      
    - code: "zh"
      name: "Chinese"
      whisper: true
      vosk: true
      coqui: true
      festival: false
      espeak: true
      
    - code: "ja"
      name: "Japanese"
      whisper: true
      vosk: false
      coqui: true
      festival: false
      espeak: true
      
    - code: "ar"
      name: "Arabic"
      whisper: true
      vosk: false
      coqui: true
      festival: false
      espeak: true

# Fallback Strategy
fallback:
  enabled: true
  strategy: "priority_cascade"  # priority_cascade, round_robin, load_balanced
  
  # Retry Configuration
  retry:
    max_attempts: 3
    retry_delay_seconds: 1.0
    exponential_backoff: true
    
  # Health Check Configuration
  health_check:
    enabled: true
    interval_seconds: 30
    timeout_seconds: 10
    failure_threshold: 3
    
  # API Fallback Configuration
  api_fallback:
    enabled: true
    use_when_local_fails: true
    rate_limit_per_minute: 60
    cost_per_request:
      stt: 0.006  # per minute
      tts: 0.015  # per 1K characters

# Monitoring and Logging
monitoring:
  enabled: true
  metrics:
    - "processing_time"
    - "model_memory_usage"
    - "gpu_utilization"
    - "success_rate"
    - "error_rate"
    
  logging:
    level: "INFO"
    log_model_switches: true
    log_performance_metrics: true
    log_errors: true
    
  alerts:
    high_memory_usage_percent: 90
    high_gpu_usage_percent: 95
    high_error_rate_percent: 10

# Development and Testing
development:
  mock_mode: false
  test_audio_path: "./test_data/test_audio.wav"
  benchmark_enabled: true
  profiling_enabled: false
  
  # Model Testing
  model_testing:
    run_health_checks_on_startup: true
    test_all_engines_on_startup: false
    benchmark_on_startup: false
