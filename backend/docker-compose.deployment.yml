version: '3.8'

services:
  # Deployment API Service
  deployment-api:
    build:
      context: ./services/deployment_api
      dockerfile: Dockerfile
    container_name: mantrapath-deployment-api
    ports:
      - "8086:8086"
    environment:
      - DEPLOYMENT_API_PORT=8086
      - DEPLOYMENT_API_HOST=0.0.0.0
      - ENVIRONMENT=development
      - DEBUG=true
      - FRONTEND_ENGINEER_SECRET=your-secret-key-change-in-production
      - JWT_SECRET_KEY=your-jwt-secret-change-in-production
      - JWT_ALGORITHM=HS256
      - RATE_LIMIT_ENABLED=true
      - DEFAULT_RATE_LIMIT=1000
      - FRONTEND_ENGINEER_LIMIT=500
      - API_GATEWAY_URL=http://host.docker.internal:8000
      - VOICE_SERVICE_URL=http://host.docker.internal:8011
      - MODELS_SERVICE_URL=http://host.docker.internal:8085
      - COMMUNITY_SERVICE_URL=http://host.docker.internal:8012
      - ML_SERVICE_URL=http://host.docker.internal:8013
    volumes:
      - ./services/deployment_api:/app
      - /app/__pycache__
    networks:
      - mantrapath-deployment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for rate limiting and caching
  redis-deployment:
    image: redis:7-alpine
    container_name: mantrapath-deployment-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_deployment_data:/data
    networks:
      - mantrapath-deployment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PostgreSQL for usage tracking (optional)
  postgres-deployment:
    image: postgres:15
    container_name: mantrapath-deployment-postgres
    environment:
      POSTGRES_DB: mantrapath_deployment
      POSTGRES_USER: deployment_user
      POSTGRES_PASSWORD: deployment_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_deployment_data:/var/lib/postgresql/data
      - ./services/deployment_api/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mantrapath-deployment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployment_user -d mantrapath_deployment"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Nginx reverse proxy for the deployment API
  nginx-deployment:
    image: nginx:alpine
    container_name: mantrapath-deployment-nginx
    ports:
      - "8087:80"
    volumes:
      - ./services/deployment_api/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mantrapath-deployment-network
    restart: unless-stopped
    depends_on:
      - deployment-api

networks:
  mantrapath-deployment-network:
    driver: bridge

volumes:
  redis_deployment_data:
  postgres_deployment_data:
