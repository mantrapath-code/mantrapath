# MantraPath Secure Docker Compose Configuration
# Only exposes API Gateway externally, all other services are internal
# This follows security best practices for microservices architecture

services:
  # Database (Internal only)
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    # REMOVED: External port exposure for security
    # Only accessible via internal Docker network
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis (Internal only)
  redis:
    image: redis:7-alpine
    # REMOVED: External port exposure for security
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # NATS (Internal only)
  nats:
    image: nats:2.10-alpine
    container_name: mantrapath-nats
    # REMOVED: External ports for security
    # Only accessible internally by services
    volumes:
      - nats_data:/data/jetstream
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: [
      "--port", "4222",
      "--http_port", "8222",
      "--jetstream",
      "--store_dir", "/data/jetstream"
    ]
    environment:
      - NATS_SERVER_NAME=mantrapath-nats
    restart: unless-stopped

  # 🚪 API Gateway - ONLY EXTERNAL SERVICE
  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      # ONLY these ports are exposed externally
      - "8000:8000"  # Main API - will be tunneled via ngrok
      - "8080:8080"  # WebSocket - will be tunneled via ngrok  
      - "9090:9090"  # Metrics - for monitoring (optional, can be removed in production)
    env_file:
      - .env
    environment:
      # V3 Enhanced Configuration
      - GATEWAY_VERSION=v3_enhanced
      - GATEWAY_ENVIRONMENT=${ENVIRONMENT:-development}
      - GATEWAY_DEBUG=${DEBUG:-true}
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      - WEBSOCKET_PORT=8080
      - METRICS_PORT=9090
      
      # Voice Features
      - VOICE_ROUTING_ENABLED=true
      - VOICE_COMMAND_TIMEOUT=5000
      - VOICE_CONFIDENCE_THRESHOLD=0.7
      - SUPPORTED_LANGUAGES=en,hi,es,fr,de,it,pt,ru,ja,zh,ko,ar,bn,ta,te,gu,mr,pa,ur,ml,kn,as
      - VOICE_SERVICE_URL=http://voice-service:8011
      
      # AI Context
      - AI_CONTEXT_ENABLED=true
      - AI_CONTEXT_CACHE_TTL=300
      - AI_CONTEXT_MAX_SIZE=1024
      - ML_SERVICE_URL=http://ml-service:8008
      
      # Cultural Intelligence
      - CULTURAL_ADAPTATION_ENABLED=true
      - CULTURAL_CONFIG_PATH=/app/config/cultural_config.yaml
      
      # Performance Monitoring
      - PERFORMANCE_MONITORING_ENABLED=true
      - PERFORMANCE_METRICS_INTERVAL=60
      
      # Database connections (internal)
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      
      # Service URLs (all internal Docker network addresses)
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PROFILE_SERVICE_URL=http://profile-service:8002
      - MOOD_SERVICE_URL=http://mood-service:8003
      - CHATBOT_SERVICE_URL=http://chatbot-service:8004
      - CONTENT_SERVICE_URL=http://content-service:8005
      - COMMUNITY_SERVICE_URL=http://community-service:8006
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - ML_SERVICE_URL=http://ml-service:8008
      - MEDIA_SERVICE_URL=http://media-service:8009
      - TRANSLATION_SERVICE_URL=http://translation-service:8010
      - VOICE_SERVICE_URL=http://voice-service:8011
      - ACTION_ORCHESTRATOR_URL=http://action-orchestrator:8012
      - AI_CONTEXT_STORE_URL=http://ai-context-store:8013
      - AI_EVENT_PROCESSOR_URL=http://ai-event-processor:8014
      - MODELS_SERVICE_URL=http://models-service:8080
      - MEMORY_SERVICE_URL=http://memory-service:8015
    
    volumes:
      - ./config/cultural_config.yaml:/app/config/cultural_config.yaml:ro
      - ./config/voice_config.yaml:/app/config/voice_config.yaml:ro
      - ./config/performance_config.yaml:/app/config/performance_config.yaml:ro
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    
    networks:
      - mantrapath-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    restart: unless-stopped

  # 🔐 AUTH SERVICE (Internal only)
  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    # REMOVED: External port - only accessible via API Gateway
    env_file:
