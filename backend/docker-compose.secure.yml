# Volumes for persistent data
volumes:
  postgres_data:
    driver: local
  nats_data:
    driver: local
  media_uploads:
    driver: local
  models_data:
    driver: local
  models_cache:
    driver: local

# Secure internal network
networks:
  mantrapath-network:
    driver: bridge
    internal: false  # Allow internet access for external API calls
    ipam:
      config:
        - subnet: 172.20.0.0/16  # Private subnet for internal communication
