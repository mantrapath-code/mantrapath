version: "3.9"
services:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redis for caching and real-time features
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # NATS for real-time messaging and WebSocket clustering with JetStream
  nats:
    image: nats:2.10-alpine
    container_name: mantrapath-nats
    ports:
      - "4222:4222"    # Client connections
      - "8222:8222"    # HTTP monitoring
      - "6222:6222"    # Clustering port
    volumes:
      - nats_data:/data/jetstream
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: [
      "--port", "4222",
      "--http_port", "8222",
      "--jetstream",
      "--store_dir", "/data/jetstream"
    ]
    environment:
      - NATS_SERVER_NAME=mantrapath-nats
    restart: unless-stopped

  # API Gateway - Main service (V3 Enhanced)
  api-gateway:
    # Unique image (avoid single shared tag across all services)
    image: mantrapath-api-gateway:${TAG:-latest}
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      - "${API_GATEWAY_PORT}:8000"  # Main API Gateway port
      - "${API_GATEWAY_WEBSOCKET_PORT}:8080"  # WebSocket port
      - "${API_GATEWAY_METRICS_PORT}:9090"  # Metrics port
    environment:
      # V3 Enhanced Configuration
      - GATEWAY_VERSION=v3_enhanced
      - GATEWAY_ENVIRONMENT=${ENVIRONMENT:-production}
      - GATEWAY_DEBUG=${DEBUG:-false}
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      - WEBSOCKET_PORT=8080
      - METRICS_PORT=9090
      
      # Voice Features
      - VOICE_ROUTING_ENABLED=true
      - VOICE_COMMAND_TIMEOUT=5000
      - VOICE_CONFIDENCE_THRESHOLD=0.7
      - SUPPORTED_LANGUAGES=en,hi,es,fr,de,it,pt,ru,ja,zh,ko,ar,bn,ta,te,gu,mr,pa,ur,ml,kn,as
      - VOICE_SERVICE_URL=http://voice-service:${VOICE_SERVICE_PORT}
      
      # AI Context
      - AI_CONTEXT_ENABLED=true
      - AI_CONTEXT_CACHE_TTL=300
      - AI_CONTEXT_MAX_SIZE=1024
      - ML_SERVICE_URL=http://ml-service:${ML_SERVICE_PORT}
      
      # Cultural Intelligence
      - CULTURAL_ADAPTATION_ENABLED=true
      - CULTURAL_CONTEXT_CACHE_TTL=600
      - DEFAULT_CULTURE=neutral
      - CULTURAL_FALLBACK_ENABLED=true
      - TRANSLATION_SERVICE_URL=http://translation-service:${TRANSLATION_SERVICE_PORT}
      
      # WebSocket Enhanced
      - WEBSOCKET_MAX_CONNECTIONS=10000
      - WEBSOCKET_HEARTBEAT_INTERVAL=30
      - WEBSOCKET_VOICE_STREAMING=true
      - WEBSOCKET_CLUSTERING_ENABLED=true
      - NATS_URL=nats://nats:4222
      
      # Performance
      - CONTEXT_CACHE_SIZE=10000
      - CONNECTION_POOL_SIZE=100
      - RESPONSE_CACHE_TTL=60
      - PERFORMANCE_MONITORING=true
      
      # Database & Cache
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_CONTEXT_DB=1
      - SERVICE_PROFILE_SERVICE_URL=http://profile-service:${PROFILE_SERVICE_PORT}
      - SERVICE_MOOD_SERVICE_URL=http://mood-service:${MOOD_SERVICE_PORT}
      - SERVICE_CHATBOT_SERVICE_URL=http://chatbot-service:${CHATBOT_SERVICE_PORT}
      - SERVICE_CONTENT_SERVICE_URL=http://content-service:${CONTENT_SERVICE_PORT}
      - SERVICE_COMMUNITY_SERVICE_URL=http://community-service:${COMMUNITY_SERVICE_PORT}
      - SERVICE_NOTIFICATION_SERVICE_URL=http://notification-service:${NOTIFICATION_SERVICE_PORT}
      - SERVICE_ML_SERVICE_URL=http://ml-service:${ML_SERVICE_PORT}
      - SERVICE_MEDIA_SERVICE_URL=http://media-service:${MEDIA_SERVICE_PORT}
      - SERVICE_TRANSLATION_SERVICE_URL=http://translation-service:${TRANSLATION_SERVICE_PORT}
      - SERVICE_ACTION_ORCHESTRATOR_URL=http://action-orchestrator:${ACTION_ORCHESTRATOR_PORT}
      - SERVICE_VOICE_SERVICE_URL=http://voice-service:${VOICE_SERVICE_PORT}
      - SERVICE_AI_CONTEXT_STORE_URL=http://ai-context-store:${AI_CONTEXT_STORE_PORT}
      - SERVICE_AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT}
      - SERVICE_MODELS_SERVICE_URL=http://models-service:${MODELS_SERVICE_INTERNAL_PORT}
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Auth Service
  auth-service:
    image: mantrapath-auth-service:${TAG:-latest}
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      - APP_URL=${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Profile Service
  profile-service:
    image: mantrapath-profile-service:${TAG:-latest}
    build:
      context: .
      dockerfile: services/profile_service/Dockerfile
    ports:
      - "${PROFILE_SERVICE_PORT}:${PROFILE_SERVICE_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Mood Service
  mood-service:
    image: mantrapath-mood-service:${TAG:-latest}
    build:
      context: .
      dockerfile: services/mood_service/Dockerfile
    ports:
      - "${MOOD_SERVICE_PORT}:${MOOD_SERVICE_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Chatbot Service (Enhanced)
  chatbot-service:
    image: mantrapath-chatbot-service:${TAG:-latest}
    build:
      context: .
      dockerfile: services/chatbot_service/Dockerfile
    ports:
      - "${CHATBOT_SERVICE_PORT}:${CHATBOT_SERVICE_PORT}"
    environment:
      # Database and Core Infrastructure
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      
      # Service Integration URLs
      - MODELS_SERVICE_URL=http://models-service:${MODELS_SERVICE_INTERNAL_PORT}
      - ML_SERVICE_URL=http://ml-service:${ML_SERVICE_PORT}
      - AI_CONTEXT_STORE_URL=http://ai-context-store:${AI_CONTEXT_STORE_PORT}
      - TRANSLATION_SERVICE_URL=http://translation-service:${TRANSLATION_SERVICE_PORT}
      - VOICE_SERVICE_URL=http://voice-service:${VOICE_SERVICE_PORT}
      - ACTION_ORCHESTRATOR_URL=http://action-orchestrator:${ACTION_ORCHESTRATOR_PORT}
      
      # Service Configuration
      - MODELS_SERVICE_TIMEOUT=30
      - MODELS_SERVICE_ENABLED=true
      - ML_SERVICE_ENABLED=true
      - AI_CONTEXT_STORE_ENABLED=true
      - TRANSLATION_SERVICE_ENABLED=true
      - VOICE_SERVICE_ENABLED=true
      - ACTION_ORCHESTRATOR_ENABLED=true
      
      # Chatbot Configuration
      - CHATBOT_DEFAULT_LANGUAGE=hi
      - CHATBOT_CRISIS_THRESHOLD=0.7
      - CHATBOT_ENABLE_VOICE=true
      - CHATBOT_ENABLE_TRANSLATION=true
      - CHATBOT_ENABLE_ML_INSIGHTS=true
      - CHATBOT_CULTURAL_ADAPTATION_ENABLED=true
      - CHATBOT_RESPONSE_TIMEOUT=30
      - CHATBOT_MAX_CONTEXT_LENGTH=4000
      - CHATBOT_LOG_LEVEL=INFO
      
      # Crisis Detection
      - CHATBOT_CRISIS_DETECTION_ENABLED=true
      - CHATBOT_EMOTION_DETECTION_ENABLED=true
      - CHATBOT_PERSONALIZATION_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      models-service:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Content Service (added for production parity)
  content-service:
    image: mantrapath-content-service:${TAG:-latest}
    build:
      context: .
      dockerfile: services/content_service/Dockerfile
    ports:
      - "${CONTENT_SERVICE_PORT}:${CONTENT_SERVICE_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CONTENT_SERVICE_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Community Service
  community-service:
    image: mantrapath-community-service:${TAG:-latest}
    build:
      context: .
      dockerfile: services/community_service/Dockerfile
    ports:
      - "${COMMUNITY_SERVICE_PORT}:${COMMUNITY_SERVICE_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    image: mantrapath-notification-service:${TAG:-latest}
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # ML Service
  ml-service:
    image: mantrapath-ml-service:${TAG:-latest}
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    ports:
      - "${ML_SERVICE_PORT}:${ML_SERVICE_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MOOD_SERVICE_URL=http://mood-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - USE_SERVER_UNIFIED_INSIGHTS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mood-service:
        condition: service_started
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Models Service
  models-service:
    image: mantrapath-models-service:${TAG:-latest}
    build:
      context: ./services/models_service
      dockerfile: Dockerfile
    command: ["./start_simple.sh"]
    ports:
      - "${MODELS_SERVICE_EXTERNAL_PORT}:${MODELS_SERVICE_INTERNAL_PORT}"  # 8081 -> 8080
    environment:
      - MODELS_SERVICE_HOST=0.0.0.0
      - MODELS_SERVICE_PORT=${MODELS_SERVICE_INTERNAL_PORT}
      - MODELS_CACHE_DIR=/app/cache
      - HUGGINGFACE_CACHE_DIR=/app/cache/huggingface
      - PYTORCH_CACHE_DIR=/app/cache/pytorch
      - WHISPER_CACHE_DIR=/app/cache/whisper
      - TTS_CACHE_DIR=/app/cache/tts
      - MODELS_DOWNLOAD_DIR=/app/models
      - LOG_LEVEL=INFO
      - ENABLE_GPU=false
      - MAX_WORKERS=4
      - REQUEST_TIMEOUT=120
      - MODEL_TIMEOUT=300
      # STT Configuration
      - STT_DEFAULT_MODEL=whisper_base
      - STT_LANGUAGES=en,hi,te,ta,bn,mr,gu,kn,ml,pa,ur,as,or,ne,si
      # TTS Configuration  
      - TTS_DEFAULT_ENGINE=espeak
      - TTS_LANGUAGES=en,hi,te,ta,bn,mr,gu,kn,ml,pa,ur,as,or,ne,si
      # NLP Configuration
      - NLP_DEFAULT_ENGINE=transformers
      - TRANSLATION_DEFAULT_ENGINE=marian
  - SENTIMENT_DEFAULT_MODEL=cardiffnlp/twitter-roberta-base-sentiment-latest
  # Preload (download) specific models in background without blocking startup (comma separated)
  - MODELS_PRELOAD_LIST=${MODELS_PRELOAD_LIST:-whisper_base,vosk_hi_small}
  - MODELS_PRELOAD_BACKGROUND=${MODELS_PRELOAD_BACKGROUND:-true}
  # When running in non-minimal mode you can skip default loads if providing custom preload list
  - MODELS_SERVICE_SKIP_DEFAULTS=${MODELS_SERVICE_SKIP_DEFAULTS:-false}
    volumes:
      - models_cache:/app/cache
      - models_data:/app/models
      - ./services/models_service/logs:/app/logs
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      # Use internal port variable instead of hard-coded 8080
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${MODELS_SERVICE_INTERNAL_PORT}/health"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Translation Service
  translation-service:
    image: mantrapath-translation-service:${TAG:-latest}
    build:
      context: .
      dockerfile: services/translation_service/Dockerfile
    ports:
      - "${TRANSLATION_SERVICE_PORT}:${TRANSLATION_SERVICE_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}/2
      - MODELS_SERVICE_URL=http://models-service:${MODELS_SERVICE_INTERNAL_PORT}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Translation Service Configuration
      - TRANSLATION_PORT=${TRANSLATION_SERVICE_PORT}
      - TRANSLATION_DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      models-service:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Voice Service
  voice-service:
    image: mantrapath-voice-service:${TAG:-latest}
    build:
      context: ./services/voice_service
      dockerfile: Dockerfile
    ports:
      - "${VOICE_SERVICE_PORT}:${VOICE_SERVICE_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - VOICE_PORT=${VOICE_SERVICE_PORT}
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      # Service Integration URLs
      - CHATBOT_SERVICE_URL=http://chatbot-service:${CHATBOT_SERVICE_PORT:-8004}
      - MOOD_SERVICE_URL=http://mood-service:${MOOD_SERVICE_PORT:-8003}
      - ANALYTICS_SERVICE_URL=http://analytics-service:${ANALYTICS_SERVICE_PORT:-8008}
      # Indian Language Support
      - DEFAULT_LANGUAGE=hi
      - SUPPORTED_LANGUAGES=hi,en,bn,ta,te,gu,mr,pa,ur,ml,kn
      # Vosk Configuration
      - VOSK_MODELS_DIR=/app/voice_models
      - VOSK_DOWNLOAD_ENABLED=true
    volumes:
      - voice_models:/app/voice_models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # AI Context Store Service
  ai-context-store:
    image: mantrapath-ai-context-store:${TAG:-latest}
    build:
      context: .
      dockerfile: services/ai_context_store/Dockerfile
    ports:
      - "${AI_CONTEXT_STORE_PORT}:${AI_CONTEXT_STORE_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - AI_CONTEXT_STORE_PORT=${AI_CONTEXT_STORE_PORT}
      - NATS_URL=nats://nats:4222
      - EVENT_BUS_TYPE=enhanced
      - CONTEXT_CACHE_TTL=3600
      - BUFFER_FLUSH_INTERVAL=30
      - HEALTH_CHECK_INTERVAL=300
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Action Orchestrator Service
  action-orchestrator:
    image: mantrapath-action-orchestrator:${TAG:-latest}
    build:
      context: .
      dockerfile: services/action_orchestrator/Dockerfile
    ports:
      - "${ACTION_ORCHESTRATOR_PORT}:${ACTION_ORCHESTRATOR_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ORCHESTRATOR_PORT=${ACTION_ORCHESTRATOR_PORT}
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT}
      - PROFILE_SERVICE_URL=http://profile-service:${PROFILE_SERVICE_PORT}
      - MOOD_SERVICE_URL=http://mood-service:${MOOD_SERVICE_PORT}
      - CHATBOT_SERVICE_URL=http://chatbot-service:${CHATBOT_SERVICE_PORT}
      - CONTENT_SERVICE_URL=http://content-service:${CONTENT_SERVICE_PORT}
      - COMMUNITY_SERVICE_URL=http://community-service:${COMMUNITY_SERVICE_PORT}
      - NOTIFICATION_SERVICE_URL=http://notification-service:${NOTIFICATION_SERVICE_PORT}
      - ML_SERVICE_URL=http://ml-service:${ML_SERVICE_PORT}
      - MEDIA_SERVICE_URL=http://media-service:${MEDIA_SERVICE_PORT}
      - TRANSLATION_SERVICE_URL=http://translation-service:${TRANSLATION_SERVICE_PORT}
      - VOICE_SERVICE_URL=http://voice-service:${VOICE_SERVICE_PORT}
      - API_GATEWAY_URL=http://api-gateway:${API_GATEWAY_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Memory Service
  memory-service:
    image: mantrapath-memory-service:${TAG:-latest}
    build:
      context: .
      dockerfile: services/memory_service/Dockerfile
    ports:
      - "${MEMORY_SERVICE_PORT}:${MEMORY_SERVICE_PORT}"
    environment:
      # Service Configuration
      - MEMORY_SERVICE_HOST=0.0.0.0
      - MEMORY_SERVICE_PORT=${MEMORY_SERVICE_PORT}
      - SERVICE_NAME=memory_service
      - SERVICE_VERSION=1.0.0
      
      # Database Configuration
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}/3
      - NATS_URL=nats://nats:4222
      
      # Authentication
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      
      # Memory Engine Configuration
      - PATTERN_ANALYSIS_WINDOW_DAYS=30
      - INSIGHT_GENERATION_THRESHOLD=10
      - CACHE_TTL_SECONDS=3600
      - BATCH_SIZE=100
      - MAX_PATTERNS_PER_USER=50
      
      # Pattern Detection Thresholds
      - MOOD_STABILITY_THRESHOLD=0.7
      - PATTERN_CONFIDENCE_THRESHOLD=0.6
      - INSIGHT_RELEVANCE_THRESHOLD=0.5
      - CULTURAL_SENSITIVITY_THRESHOLD=0.8
      
      # Cultural Adaptation
      - CULTURAL_ADAPTATION_ENABLED=true
      - CULTURAL_FALLBACK_ENABLED=true
      - DEFAULT_CULTURE=neutral
      
      # Event Processing
      - EVENT_CONSUMER_GROUP=memory_service
      - MAX_EVENT_PROCESSING_RETRIES=3
      - EVENT_PROCESSING_TIMEOUT=30
      
      # Performance Configuration
      - MAX_CONCURRENT_ANALYSIS=10
      - ANALYSIS_TIMEOUT=60
      - CACHE_OPTIMIZATION=true
      - BATCH_PROCESSING_ENABLED=true
      
      # Logging and Monitoring
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      - METRICS_ENABLED=true
      - HEALTH_CHECK_INTERVAL=30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8017/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # AI Event Processor Service (added for production parity)
  ai-event-processor:
    image: mantrapath-ai-event-processor:${TAG:-latest}
    build:
      context: .
      dockerfile: services/ai_event_processor/Dockerfile
    ports:
      - "${AI_EVENT_PROCESSOR_PORT}:${AI_EVENT_PROCESSOR_PORT}"
    environment:
      - AI_EVENT_PROCESSOR_HOST=0.0.0.0
      - AI_EVENT_PROCESSOR_PORT=${AI_EVENT_PROCESSOR_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NATS_URL=nats://nats:4222
      - NATS_SERVERS=nats://nats:4222
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      - AI_MODELS_CACHE_DIR=/app/models_cache
      - EMOTION_MODEL_NAME=j-hartmann/emotion-english-distilroberta-base
      - SENTIMENT_MODEL_NAME=cardiffnlp/twitter-roberta-base-sentiment-latest
      - DEVICE=cpu
      - MAX_CONCURRENT_EVENTS=100
      - EVENT_PROCESSING_TIMEOUT=300
      - CONTEXT_CACHE_TTL=3600
      - METRICS_EXPORT_INTERVAL=60
      - MODELS_SERVICE_URL=http://models-service:${MODELS_SERVICE_INTERNAL_PORT}
      - MODELS_SERVICE_ENABLED=true
      - USE_MODELS_SERVICE=true
      - MODELS_SERVICE_TIMEOUT=30
    volumes:
      - ai_models_cache:/app/models_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      models-service:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AI_EVENT_PROCESSOR_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Media Service (added for production parity)
  media-service:
    image: mantrapath-media-service:${TAG:-latest}
    build:
      context: .
      dockerfile: services/media_service/Dockerfile
    ports:
      - "${MEDIA_SERVICE_PORT}:${MEDIA_SERVICE_PORT}"  # host -> container (e.g. 8021)
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Proactive Assistance Engine (optional)
  proactive-assistance:
    image: mantrapath-proactive-assistance:${TAG:-latest}
    build:
      context: .
      dockerfile: services/proactive_assistance_engine/Dockerfile
    ports:
      - "${PROACTIVE_ASSISTANCE_PORT}:${PROACTIVE_ASSISTANCE_PORT}"
    environment:
      - PROACTIVE_ASSISTANCE_PORT=${PROACTIVE_ASSISTANCE_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      - NATS_URL=nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PROACTIVE_ASSISTANCE_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PHI4 Agent (legacy / experimental)
  phi4-agent:
    image: mantrapath-phi4-agent:${TAG:-latest}
    build:
      context: .
      dockerfile: services/phi3_agent/Dockerfile
    ports:
      - "${PHI4_AGENT_PORT}:8000"  # 8016 -> 8000 internal
    environment:
      - PHI4_AGENT_PORT=${PHI4_AGENT_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  nats_data:
  models_cache:
  models_data:
  voice_models:
  ai_models_cache:

networks:
  mantrapath-network:
    driver: bridge
