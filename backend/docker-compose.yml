services:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis for caching and real-time features
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # NATS for real-time messaging and WebSocket clustering with JetStream
  nats:
    image: nats:2.10-alpine
    container_name: mantrapath-nats
    ports:
      - "4222:4222"    # Client connections
      - "8222:8222"    # HTTP monitoring
      - "6222:6222"    # Clustering port
    volumes:
      - nats_data:/data/jetstream
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: [
      "--port", "4222",
      "--http_port", "8222",
      "--jetstream",
      "--store_dir", "/data/jetstream"
    ]
    environment:
      - NATS_SERVER_NAME=mantrapath-nats
    restart: unless-stopped

  # API Gateway - Main service (V3 Enhanced)
  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      - "${API_GATEWAY_PORT}:8000"  # Main API Gateway port
      - "${API_GATEWAY_WEBSOCKET_PORT}:8080"  # WebSocket port (fixed conflict)
      - "${API_GATEWAY_METRICS_PORT}:9090"  # Metrics port
    env_file:
      - .env
    environment:
      # V3 Enhanced Configuration
      - GATEWAY_VERSION=v3_enhanced
      - GATEWAY_ENVIRONMENT=${ENVIRONMENT:-development}
      - GATEWAY_DEBUG=${DEBUG:-true}
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      - WEBSOCKET_PORT=8080
      - METRICS_PORT=9090
      
      # Voice Features
      - VOICE_ROUTING_ENABLED=true
      - VOICE_COMMAND_TIMEOUT=5000
      - VOICE_CONFIDENCE_THRESHOLD=0.7
      - SUPPORTED_LANGUAGES=en,hi,es,fr,de,it,pt,ru,ja,zh,ko,ar,bn,ta,te,gu,mr,pa,ur,ml,kn,as
      - VOICE_SERVICE_URL=http://voice-service:${VOICE_SERVICE_PORT}
      
      # AI Context
      - AI_CONTEXT_ENABLED=true
      - AI_CONTEXT_CACHE_TTL=300
      - AI_CONTEXT_MAX_SIZE=1024
      - ML_SERVICE_URL=http://ml-service:${ML_SERVICE_PORT}
      
      # Cultural Intelligence
      - CULTURAL_ADAPTATION_ENABLED=true
      - CULTURAL_CONTEXT_CACHE_TTL=600
      - DEFAULT_CULTURE=neutral
      - CULTURAL_FALLBACK_ENABLED=true
      - TRANSLATION_SERVICE_URL=http://translation-service:${TRANSLATION_SERVICE_PORT}
      
      # WebSocket Enhanced
      - WEBSOCKET_MAX_CONNECTIONS=10000
      - WEBSOCKET_HEARTBEAT_INTERVAL=30
      - WEBSOCKET_VOICE_STREAMING=true
      - WEBSOCKET_CLUSTERING_ENABLED=true
      - NATS_URL=nats://nats:4222
      
      # Performance
      - CONTEXT_CACHE_SIZE=10000
      - CONNECTION_POOL_SIZE=100
      - RESPONSE_CACHE_TTL=60
      - PERFORMANCE_MONITORING=true
      
      # Database & Cache
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mantrapath}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CONTEXT_DB=1
      - SERVICE_PROFILE_SERVICE_URL=http://profile-service:${PROFILE_SERVICE_PORT}
      - SERVICE_MOOD_SERVICE_URL=http://mood-service:${MOOD_SERVICE_PORT}
      - SERVICE_CHATBOT_SERVICE_URL=http://chatbot-service:${CHATBOT_SERVICE_PORT}
      - SERVICE_CONTENT_SERVICE_URL=http://content-service:${CONTENT_SERVICE_PORT}
      - SERVICE_COMMUNITY_SERVICE_URL=http://community-service:${COMMUNITY_SERVICE_PORT}
      - SERVICE_NOTIFICATION_SERVICE_URL=http://notification-service:${NOTIFICATION_SERVICE_PORT}
      - SERVICE_ML_SERVICE_URL=http://ml-service:${ML_SERVICE_PORT}
      - SERVICE_MEDIA_SERVICE_URL=http://media-service:${MEDIA_SERVICE_PORT}
      - SERVICE_TRANSLATION_SERVICE_URL=http://translation-service:${TRANSLATION_SERVICE_PORT}
      - SERVICE_ACTION_ORCHESTRATOR_URL=http://action-orchestrator:${ACTION_ORCHESTRATOR_PORT}
      - SERVICE_VOICE_SERVICE_URL=http://voice-service:${VOICE_SERVICE_PORT}
      - SERVICE_AI_CONTEXT_STORE_URL=http://ai-context-store:${AI_CONTEXT_STORE_PORT}
      - SERVICE_AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT}
      - SERVICE_MODELS_SERVICE_URL=http://models-service:${MODELS_SERVICE_INTERNAL_PORT}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_GATEWAY_PORT}/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      - APP_URL=${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Profile Service
  profile-service:
    build:
      context: .
      dockerfile: services/profile_service/Dockerfile
    ports:
      - "${PROFILE_SERVICE_PORT}:${PROFILE_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Mood Service
  mood-service:
    build:
      context: .
      dockerfile: services/mood_service/Dockerfile
    ports:
      - "${MOOD_SERVICE_PORT}:${MOOD_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Agent Redis for ML caching
  agent-redis:
    image: redis:7-alpine
    container_name: mantrapath_agent_redis
    ports:
      - "6380:6379"
    volumes:
      - agent_redis_data:/data
    restart: unless-stopped
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Chatbot Service (Enhanced - Phase 1)
  chatbot-service:
    build:
      context: .
      dockerfile: services/chatbot_service/Dockerfile
    ports:
      - "${CHATBOT_SERVICE_PORT}:${CHATBOT_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      # Database and Core Infrastructure
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - AGENT_REDIS_URL=redis://agent-redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - PHI4_MODEL_AVAILABLE=true
      - OLLAMA_URL=http://host.docker.internal:11434
      
      # Phase 1 Service Integration URLs (using environment variables)
      - MODELS_SERVICE_URL=http://models-service:${MODELS_SERVICE_INTERNAL_PORT}
      - ML_SERVICE_URL=http://ml-service:${ML_SERVICE_PORT}
      - AI_CONTEXT_STORE_URL=http://ai-context-store:${AI_CONTEXT_STORE_PORT}
      - TRANSLATION_SERVICE_URL=http://translation-service:${TRANSLATION_SERVICE_PORT}
      - VOICE_SERVICE_URL=http://voice-service:${VOICE_SERVICE_PORT}
      - ACTION_ORCHESTRATOR_URL=http://action-orchestrator:${ACTION_ORCHESTRATOR_PORT}
      
      # Service Configuration
      - MODELS_SERVICE_TIMEOUT=30
      - MODELS_SERVICE_ENABLED=true
      - ML_SERVICE_ENABLED=true
      - AI_CONTEXT_STORE_ENABLED=true
      - TRANSLATION_SERVICE_ENABLED=true
      - VOICE_SERVICE_ENABLED=true
      - ACTION_ORCHESTRATOR_ENABLED=true
      
      # Chatbot Configuration
      - CHATBOT_DEFAULT_LANGUAGE=hi
      - CHATBOT_CRISIS_THRESHOLD=0.7
      - CHATBOT_ENABLE_VOICE=true
      - CHATBOT_ENABLE_TRANSLATION=true
      - CHATBOT_ENABLE_ML_INSIGHTS=true
      - CHATBOT_CULTURAL_ADAPTATION_ENABLED=true
      - CHATBOT_RESPONSE_TIMEOUT=30
      - CHATBOT_MAX_CONTEXT_LENGTH=4000
      - CHATBOT_LOG_LEVEL=INFO
      
      # Crisis Detection
      - CHATBOT_CRISIS_DETECTION_ENABLED=true
      - CHATBOT_EMOTION_DETECTION_ENABLED=true
      - CHATBOT_PERSONALIZATION_ENABLED=true
      
      # External API Keys (Phase 1 eliminates these dependencies)
      # - OPENAI_API_KEY=${OPENAI_API_KEY:-disabled-using-internal-services}
      
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-redis:
        condition: service_healthy
      models-service:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Content Service
  content-service:
    build:
      context: .
      dockerfile: services/content_service/Dockerfile
    ports:
      - "${CONTENT_SERVICE_PORT}:${CONTENT_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Community Service
  community-service:
    build:
      context: .
      dockerfile: services/community_service/Dockerfile
    ports:
      - "${COMMUNITY_SERVICE_PORT}:${COMMUNITY_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # ML Service
  ml-service:
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    ports:
      - "${ML_SERVICE_PORT}:${ML_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - MOOD_SERVICE_URL=http://mood-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - USE_SERVER_UNIFIED_INSIGHTS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mood-service:
        condition: service_started
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Models Service (NEW - BK-008 Integration)
  models-service:
    build:
      context: ./services/models_service
      dockerfile: Dockerfile
    ports:
      - "${MODELS_SERVICE_EXTERNAL_PORT}:${MODELS_SERVICE_INTERNAL_PORT}"
    env_file:
      - .env
    environment:
      - MODELS_SERVICE_HOST=0.0.0.0
      - MODELS_SERVICE_PORT=${MODELS_SERVICE_INTERNAL_PORT}
      - MODELS_CACHE_DIR=/app/cache
      - HUGGINGFACE_CACHE_DIR=/app/cache/huggingface
      - PYTORCH_CACHE_DIR=/app/cache/pytorch
      - WHISPER_CACHE_DIR=/app/cache/whisper
      - TTS_CACHE_DIR=/app/cache/tts
      - MODELS_DOWNLOAD_DIR=/app/models
      - LOG_LEVEL=INFO
      - ENABLE_GPU=false
      - MAX_WORKERS=4
      - REQUEST_TIMEOUT=120
      - MODEL_TIMEOUT=300
      # STT Configuration
      - STT_DEFAULT_MODEL=whisper_base
      - STT_LANGUAGES=en,hi,te,ta,bn,mr,gu,kn,ml,pa,ur,as,or,ne,si
      # TTS Configuration  
      - TTS_DEFAULT_ENGINE=espeak
      - TTS_LANGUAGES=en,hi,te,ta,bn,mr,gu,kn,ml,pa,ur,as,or,ne,si
      # NLP Configuration
      - NLP_DEFAULT_ENGINE=transformers
      - TRANSLATION_DEFAULT_ENGINE=marian
      - SENTIMENT_DEFAULT_MODEL=cardiffnlp/twitter-roberta-base-sentiment-latest
    volumes:
      - models_cache:/app/cache
      - models_data:/app/models
      - ./services/models_service/logs:/app/logs
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 120s  # Models service needs more time to start
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # AI Context Store Service
  ai-context-store:
    build:
      context: .
      dockerfile: services/ai_context_store/Dockerfile
    ports:
      - "${AI_CONTEXT_STORE_PORT}:${AI_CONTEXT_STORE_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - AI_CONTEXT_STORE_PORT=${AI_CONTEXT_STORE_PORT}
      - NATS_URL=nats://nats:4222
      - EVENT_BUS_TYPE=enhanced
      - CONTEXT_CACHE_TTL=3600
      - BUFFER_FLUSH_INTERVAL=30
      - HEALTH_CHECK_INTERVAL=300
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Media Service
  media-service:
    build:
      context: .
      dockerfile: services/media_service/Dockerfile
    ports:
      - "${MEDIA_SERVICE_PORT}:${MEDIA_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Translation Service
  translation-service:
    build:
      context: .
      dockerfile: services/translation_service/Dockerfile
    ports:
      - "${TRANSLATION_SERVICE_PORT}:${TRANSLATION_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Voice Service
  voice-service:
    build:
      context: .
      dockerfile: services/voice_service/Dockerfile
    ports:
      - "${VOICE_SERVICE_PORT}:${VOICE_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT}
      - PROFILE_SERVICE_URL=http://profile-service:${PROFILE_SERVICE_PORT}
      - CONTENT_SERVICE_URL=http://content-service:${CONTENT_SERVICE_PORT}
      - COMMUNITY_SERVICE_URL=http://community-service:${COMMUNITY_SERVICE_PORT}
      - TRANSLATION_SERVICE_URL=http://translation-service:${TRANSLATION_SERVICE_PORT}
      - NOTIFICATION_SERVICE_URL=http://notification-service:${NOTIFICATION_SERVICE_PORT}
      - MEDIA_SERVICE_URL=http://media-service:${MEDIA_SERVICE_PORT}
      - MOOD_SERVICE_URL=http://mood-service:${MOOD_SERVICE_PORT}
      - API_GATEWAY_URL=http://api-gateway:${API_GATEWAY_PORT}
      - ACTION_ORCHESTRATOR_URL=http://action-orchestrator:${ACTION_ORCHESTRATOR_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Action Orchestrator Service
  action-orchestrator:
    build:
      context: .
      dockerfile: services/action_orchestrator/Dockerfile
    ports:
      - "${ACTION_ORCHESTRATOR_PORT}:${ACTION_ORCHESTRATOR_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ORCHESTRATOR_PORT=${ACTION_ORCHESTRATOR_PORT}
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT}
      - PROFILE_SERVICE_URL=http://profile-service:${PROFILE_SERVICE_PORT}
      - MOOD_SERVICE_URL=http://mood-service:${MOOD_SERVICE_PORT}
      - CHATBOT_SERVICE_URL=http://chatbot-service:${CHATBOT_SERVICE_PORT}
      - CONTENT_SERVICE_URL=http://content-service:${CONTENT_SERVICE_PORT}
      - COMMUNITY_SERVICE_URL=http://community-service:${COMMUNITY_SERVICE_PORT}
      - NOTIFICATION_SERVICE_URL=http://notification-service:${NOTIFICATION_SERVICE_PORT}
      - ML_SERVICE_URL=http://ml-service:${ML_SERVICE_PORT}
      - MEDIA_SERVICE_URL=http://media-service:${MEDIA_SERVICE_PORT}
      - TRANSLATION_SERVICE_URL=http://translation-service:${TRANSLATION_SERVICE_PORT}
      - VOICE_SERVICE_URL=http://voice-service:${VOICE_SERVICE_PORT}
      - API_GATEWAY_URL=http://api-gateway:${API_GATEWAY_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # AI Event Processor Service (V3 Sprint 2)
  ai-event-processor:
    build:
      context: .
      dockerfile: services/ai_event_processor/Dockerfile
    ports:
      - "${AI_EVENT_PROCESSOR_PORT}:${AI_EVENT_PROCESSOR_PORT}"
    env_file:
      - .env
    environment:
      - AI_EVENT_PROCESSOR_HOST=0.0.0.0
      - AI_EVENT_PROCESSOR_PORT=${AI_EVENT_PROCESSOR_PORT}
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - NATS_SERVERS=nats://nats:4222
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - LOG_LEVEL=info
      - ENVIRONMENT=development
      # AI Model Configuration
      - AI_MODELS_CACHE_DIR=/app/models_cache
      - EMOTION_MODEL_NAME=j-hartmann/emotion-english-distilroberta-base
      - SENTIMENT_MODEL_NAME=cardiffnlp/twitter-roberta-base-sentiment-latest
      - DEVICE=cpu
      # Performance Configuration
      - MAX_CONCURRENT_EVENTS=100
      - EVENT_PROCESSING_TIMEOUT=300
      - CONTEXT_CACHE_TTL=3600
      - METRICS_EXPORT_INTERVAL=60
    volumes:
      - ai_models_cache:/app/models_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8014/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Proactive Assistance Engine Service (V3 Sprint 2)
  proactive-assistance-engine:
    build:
      context: .
      dockerfile: services/proactive_assistance_engine/Dockerfile
    ports:
      - "${PROACTIVE_ASSISTANCE_PORT}:${PROACTIVE_ASSISTANCE_PORT}"
    env_file:
      - .env
    environment:
      - PROACTIVE_ASSISTANCE_HOST=0.0.0.0
      - PROACTIVE_ASSISTANCE_PORT=${PROACTIVE_ASSISTANCE_PORT}
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - LOG_LEVEL=info
      - ENVIRONMENT=development
      - DEMO_MODE=true  # Enable demonstration mode with sample assistance content
      # Service Integration URLs
      - AI_EVENT_PROCESSOR_URL=http://ai-event-processor:${AI_EVENT_PROCESSOR_PORT}
      - AI_CONTEXT_STORE_URL=http://ai-context-store:${AI_CONTEXT_STORE_PORT}
      - CULTURAL_INTELLIGENCE_URL=http://memory-service:${MEMORY_SERVICE_PORT}
      - MODELS_SERVICE_URL=http://models-service:${MODELS_SERVICE_INTERNAL_PORT}  # NEW - Models Service Integration
      # Performance Configuration
      - MAX_CONCURRENT_EVALUATIONS=50
      - EVALUATION_TIMEOUT=30
      - ASSISTANCE_CACHE_TTL=1800
      - METRICS_EXPORT_INTERVAL=60
      # Cultural Intelligence Configuration
      - CULTURAL_ADAPTATION_ENABLED=true
      - CULTURAL_FALLBACK_ENABLED=true
      - DEFAULT_CULTURE=neutral
      # Timing Configuration
      - MIN_ASSISTANCE_GAP_MINUTES=30
      - MAX_DAILY_ASSISTANCE=10
      - PREFERRED_TIME_WINDOWS=enabled
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      ai-event-processor:
        condition: service_healthy
      ai-context-store:
        condition: service_healthy
      models-service:  # NEW - Models Service dependency
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8018/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Voice Event Processor Service (V3 Sprint 2)
  voice-event-processor:
    build:
      context: .
      dockerfile: services/voice_event_processor/Dockerfile
    ports:
      - "${VOICE_EVENT_PROCESSOR_PORT}:${VOICE_EVENT_PROCESSOR_PORT}"
    env_file:
      - .env
    environment:
      - VOICE_EVENT_PROCESSOR_HOST=0.0.0.0
      - VOICE_EVENT_PROCESSOR_PORT=${VOICE_EVENT_PROCESSOR_PORT}
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - LOG_LEVEL=info
      - ENVIRONMENT=development
      # Voice Processing Configuration
      - MAX_CONCURRENT_STREAMS=100
      - VAD_SENSITIVITY=0.7
      - VOICE_STREAMING_ENABLED=true
      - AUDIO_SAMPLE_RATE=16000
      - AUDIO_CHUNK_SIZE=1024
      - VOICE_EMOTION_MODEL=speechbrain/emotion-recognition-wav2vec2-IEMOCAP
      # Performance Configuration
      - STREAM_TIMEOUT=30
      - ACTIVITY_DETECTION_TIMEOUT=50
      - EMOTION_ANALYSIS_TIMEOUT=200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Memory Service (V3 Sprint 3) - Port 8017
  memory-service:
    build:
      context: .
      dockerfile: services/memory_service/Dockerfile
    ports:
      - "${MEMORY_SERVICE_PORT}:${MEMORY_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      # Service Configuration
      - MEMORY_SERVICE_HOST=0.0.0.0
      - MEMORY_SERVICE_PORT=${MEMORY_SERVICE_PORT}
      - SERVICE_NAME=memory_service
      - SERVICE_VERSION=1.0.0
      
      # Database Configuration
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379/3
      - NATS_URL=nats://nats:4222
      
      # Authentication
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      
      # Memory Engine Configuration
      - PATTERN_ANALYSIS_WINDOW_DAYS=30
      - INSIGHT_GENERATION_THRESHOLD=10
      - CACHE_TTL_SECONDS=3600
      - BATCH_SIZE=100
      - MAX_PATTERNS_PER_USER=50
      
      # Pattern Detection Thresholds
      - MOOD_STABILITY_THRESHOLD=0.7
      - PATTERN_CONFIDENCE_THRESHOLD=0.6
      - INSIGHT_RELEVANCE_THRESHOLD=0.5
      - CULTURAL_SENSITIVITY_THRESHOLD=0.8
      
      # Cultural Adaptation
      - CULTURAL_ADAPTATION_ENABLED=true
      - CULTURAL_FALLBACK_ENABLED=true
      - DEFAULT_CULTURE=neutral
      
      # Event Processing
      - EVENT_CONSUMER_GROUP=memory_service
      - MAX_EVENT_PROCESSING_RETRIES=3
      - EVENT_PROCESSING_TIMEOUT=30
      
      # Performance Configuration
      - MAX_CONCURRENT_ANALYSIS=10
      - ANALYSIS_TIMEOUT=60
      - CACHE_OPTIMIZATION=true
      - BATCH_PROCESSING_ENABLED=true
      
      # Logging and Monitoring
      - LOG_LEVEL=info
      - ENVIRONMENT=development
      - METRICS_ENABLED=true
      - HEALTH_CHECK_INTERVAL=30
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8017/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

