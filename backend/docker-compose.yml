  # Frontend Service - React Application
  frontend:
    build:
      context: ../frontend
      # Use the Dockerfile that exists in the frontend directory
      dockerfile: Dockerfile
      args:
        - VITE_API_GATEWAY_URL=${VITE_API_GATEWAY_URL}
        - VITE_WS_URL=${VITE_WS_URL}
        - VITE_API_URL=${VITE_API_URL}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_ML_SERVICE_URL=${VITE_ML_SERVICE_URL}
    # Expose frontend directly (reverse proxy disabled)
    ports:
      - "80:80"  # Map host port 80 to container port 80 for external access
    environment:
      - VITE_FRONTEND_PORT=${VITE_FRONTEND_PORT}
      - VITE_API_GATEWAY_URL=${VITE_API_GATEWAY_URL}
      - VITE_WS_URL=${VITE_WS_URL}
      - VITE_API_URL=${VITE_API_URL}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_ML_SERVICE_URL=${VITE_ML_SERVICE_URL}
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
