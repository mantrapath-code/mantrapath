services:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis for caching and real-time features
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # API Gateway - New Modular Implementation
  api-gateway:
    build:
      context: ./services/api_gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Gateway Configuration
      - GATEWAY_ENVIRONMENT=development
      - GATEWAY_DEBUG=true
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=${API_GATEWAY_PORT}
      - GATEWAY_REDIS_URL=redis://redis:6379
      
      # Service URLs
      - SERVICE_AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT}
      - SERVICE_PROFILE_SERVICE_URL=http://profile-service:${PROFILE_SERVICE_PORT}
      - SERVICE_MOOD_SERVICE_URL=http://mood-service:${MOOD_SERVICE_PORT}
      - SERVICE_CHATBOT_SERVICE_URL=http://chatbot-service:${CHATBOT_SERVICE_PORT}
      - SERVICE_CONTENT_SERVICE_URL=http://content-service:${CONTENT_SERVICE_PORT}
      - SERVICE_COMMUNITY_SERVICE_URL=http://community-service:${COMMUNITY_SERVICE_PORT}
      - SERVICE_NOTIFICATION_SERVICE_URL=http://notification-service:${NOTIFICATION_SERVICE_PORT}
      - SERVICE_ML_SERVICE_URL=http://ml-service:${ML_SERVICE_PORT}
      - SERVICE_MEDIA_SERVICE_URL=http://media-service:${MEDIA_SERVICE_PORT}
      - SERVICE_TRANSLATION_SERVICE_URL=http://translation-service:${TRANSLATION_SERVICE_PORT}
      - SERVICE_ACTION_ORCHESTRATOR_URL=http://action-orchestrator:${ACTION_ORCHESTRATOR_PORT}
      - SERVICE_VOICE_SERVICE_URL=http://voice-service:8011
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_GATEWAY_PORT}/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      - APP_URL=${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Profile Service
  profile-service:
    build:
      context: .
      dockerfile: services/profile_service/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Mood Service
  mood-service:
    build:
      context: .
      dockerfile: services/mood_service/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Agent Redis for ML caching
  agent-redis:
    image: redis:7-alpine
    container_name: mantrapath_agent_redis
    ports:
      - "6380:6379"
    volumes:
      - agent_redis_data:/data
    restart: unless-stopped
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Chatbot Service
  chatbot-service:
    build:
      context: .
      dockerfile: services/chatbot_service/Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - AGENT_REDIS_URL=redis://agent-redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-api-key-here}
      - PHI4_MODEL_AVAILABLE=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Content Service
  content-service:
    build:
      context: .
      dockerfile: services/content_service/Dockerfile
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Community Service
  community-service:
    build:
      context: .
      dockerfile: services/community_service/Dockerfile
    ports:
      - "8006:8006"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    ports:
      - "8007:8007"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # ML Service
  ml-service:
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    ports:
      - "8008:8008"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - MOOD_SERVICE_URL=http://mood-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - USE_SERVER_UNIFIED_INSIGHTS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mood-service:
        condition: service_started
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Media Service
  media-service:
    build:
      context: .
      dockerfile: services/media_service/Dockerfile
    ports:
      - "8009:8009"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Translation Service
  translation-service:
    build:
      context: .
      dockerfile: services/translation_service/Dockerfile
    ports:
      - "8010:8010"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Voice Service
  voice-service:
    build:
      context: .
      dockerfile: services/voice_service/Dockerfile
    ports:
      - "8011:8011"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PROFILE_SERVICE_URL=http://profile-service:8002
      - CONTENT_SERVICE_URL=http://content-service:8005
      - COMMUNITY_SERVICE_URL=http://community-service:8006
      - TRANSLATION_SERVICE_URL=http://translation-service:8010
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - MEDIA_SERVICE_URL=http://media-service:8009
      - MOOD_SERVICE_URL=http://mood-service:8003
      - API_GATEWAY_URL=http://api-gateway:8000
      - ACTION_ORCHESTRATOR_URL=http://action-orchestrator:8012
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Action Orchestrator Service
  action-orchestrator:
    build:
      context: .
      dockerfile: services/action_orchestrator/Dockerfile
    ports:
      - "8012:8012"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ORCHESTRATOR_PORT=8012
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PROFILE_SERVICE_URL=http://profile-service:8002
      - MOOD_SERVICE_URL=http://mood-service:8003
      - CHATBOT_SERVICE_URL=http://chatbot-service:8004
      - CONTENT_SERVICE_URL=http://content-service:8005
      - COMMUNITY_SERVICE_URL=http://community-service:8006
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - ML_SERVICE_URL=http://ml-service:8008
      - MEDIA_SERVICE_URL=http://media-service:8009
      - TRANSLATION_SERVICE_URL=http://translation-service:8010
      - VOICE_SERVICE_URL=http://voice-service:8011
      - API_GATEWAY_URL=http://api-gateway:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  agent_redis_data:

networks:
  mantrapath-network:
    driver: bridge