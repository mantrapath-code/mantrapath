version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mantrapath
      POSTGRES_USER: mantrapath
      POSTGRES_PASSWORD: mantrapath123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mantrapath"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass mantrapath123
    volumes:
      - redis_data:/data
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mantrapath
      MONGO_INITDB_ROOT_PASSWORD: mantrapath123
      MONGO_INITDB_DATABASE: mantrapath
    volumes:
      - mongodb_data:/data/db
    networks:
      - mantrapath-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: mantrapath
      DOCKER_INFLUXDB_INIT_PASSWORD: mantrapath123
      DOCKER_INFLUXDB_INIT_ORG: mantrapath
      DOCKER_INFLUXDB_INIT_BUCKET: mood-analytics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: mantrapath-super-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend Services
  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://:mantrapath123@redis:6379
      - JWT_SECRET_KEY=your-super-secret-jwt-key-here
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://:mantrapath123@redis:6379
      - JWT_SECRET_KEY=your-super-secret-jwt-key-here
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    networks:
      - mantrapath-network
    restart: unless-stopped

  profile-service:
    build:
      context: .
      dockerfile: services/profile_service/Dockerfile
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://:mantrapath123@redis:6379
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    networks:
      - mantrapath-network
    restart: unless-stopped

  mood-service:
    build:
      context: .
      dockerfile: services/mood_service/Dockerfile
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://:mantrapath123@redis:6379
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=mantrapath-super-secret-token
      - INFLUXDB_ORG=mantrapath
      - INFLUXDB_BUCKET=mood-analytics
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    networks:
      - mantrapath-network
    restart: unless-stopped

  chatbot-service:
    build:
      context: .
      dockerfile: services/chatbot_service/Dockerfile
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://:mantrapath123@redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    networks:
      - mantrapath-network
    restart: unless-stopped

  content-service:
    build:
      context: .
      dockerfile: services/content_service/Dockerfile
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://:mantrapath123@redis:6379
      - MONGODB_URL=mongodb://mantrapath:mantrapath123@mongodb:27017/mantrapath
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    networks:
      - mantrapath-network
    restart: unless-stopped

  community-service:
    build:
      context: .
      dockerfile: services/community_service/Dockerfile
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://:mantrapath123@redis:6379
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    networks:
      - mantrapath-network
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://:mantrapath123@redis:6379
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
    networks:
      - mantrapath-network
    restart: unless-stopped

  media-service:
    build:
      context: .
      dockerfile: services/media_service/Dockerfile
    ports:
      - "8009:8009"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://:mantrapath123@redis:6379
      - MEDIA_STORAGE_PATH=/app/uploads
    volumes:
      - ./services:/app/services
      - ./shared:/app/shared
      - media_uploads:/app/uploads
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ../
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8007
    volumes:
      - ../src:/app/src
      - ../public:/app/public
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Reverse Proxy/Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - api-gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Monitoring Services
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - mantrapath-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=mantrapath123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - mantrapath-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  influxdb_data:
  media_uploads:
  prometheus_data:
  grafana_data:

networks:
  mantrapath-network:
    driver: bridge