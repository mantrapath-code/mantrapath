services:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mantrapath
      POSTGRES_USER: mantrapath
      POSTGRES_PASSWORD: mantrapath123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mantrapath -d mantrapath"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis for caching and real-time features
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PROFILE_SERVICE_URL=http://profile-service:8002
      - MOOD_SERVICE_URL=http://mood-service:8003
      - CHATBOT_SERVICE_URL=http://chatbot-service:8004
      - CONTENT_SERVICE_URL=http://content-service:8005
      - COMMUNITY_SERVICE_URL=http://community-service:8006
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - ML_SERVICE_URL=http://ml-service:8008
      - MEDIA_SERVICE_URL=http://media-service:8009
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      profile-service:
        condition: service_started
      mood-service:
        condition: service_started
      chatbot-service:
        condition: service_started
      content-service:
        condition: service_started
      community-service:
        condition: service_started
      notification-service:
        condition: service_started
      ml-service:
        condition: service_started
      media-service:
        condition: service_started
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      # Email configuration will be loaded from .env file
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      - APP_URL=${APP_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Profile Service
  profile-service:
    build:
      context: .
      dockerfile: services/profile_service/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Mood Service
  mood-service:
    build:
      context: .
      dockerfile: services/mood_service/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Phi-3 Mini Agent Service (Local AI)
  phi3-agent:
    image: vllm/vllm-openai:latest
    container_name: mantrapath_phi3_agent
    environment:
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_LOGGING_LEVEL=DEBUG
      - CUDA_VISIBLE_DEVICES=""
      - VLLM_USE_CPU=1
    ports:
      - "8010:8000"  # Different port to avoid conflicts
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: [
      "--model", "microsoft/Phi-3-mini-4k-instruct",
      "--served-model-name", "phi3-mini",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--max-model-len", "4096",
      "--trust-remote-code",
      "--tensor-parallel-size", "1",
      "--max-num-seqs", "16",
      "--disable-log-requests",
      "--device", "cpu",
      "--dtype", "float32"
    ]
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 180s
    networks:
      - mantrapath-network

  # Agent Redis for ML caching
  agent-redis:
    image: redis:7-alpine
    container_name: mantrapath_agent_redis
    ports:
      - "6380:6379"
    volumes:
      - agent_redis_data:/data
    restart: unless-stopped
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Chatbot Service
  chatbot-service:
    build:
      context: .
      dockerfile: services/chatbot_service/Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - AGENT_REDIS_URL=redis://agent-redis:6379
      - PHI3_AGENT_URL=http://phi3-agent:8000/v1/chat/completions
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-api-key-here}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-redis:
        condition: service_healthy
      # phi3-agent is optional - service will use fallback if not available
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Content Service
  content-service:
    build:
      context: .
      dockerfile: services/content_service/Dockerfile
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Community Service
  community-service:
    build:
      context: .
      dockerfile: services/community_service/Dockerfile
    ports:
      - "8006:8006"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    ports:
      - "8007:8007"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

  # ML Service
  ml-service:
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    ports:
      - "8008:8008"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - MOOD_SERVICE_URL=http://mood-service:8003
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mood-service:
        condition: service_started
    networks:
      - mantrapath-network
    restart: unless-stopped

  # Media Service
  media-service:
    build:
      context: .
      dockerfile: services/media_service/Dockerfile
    ports:
      - "8009:8009"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped

volumes:
  postgres_data:
  agent_redis_data:

networks:
  mantrapath-network:
    driver: bridge