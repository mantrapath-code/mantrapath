version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mantrapath
      POSTGRES_USER: mantrapath
      POSTGRES_PASSWORD: mantrapath123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - mantrapath-network

  # Redis for caching and real-time features
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - mantrapath-network

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - mantrapath-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
    depends_on:
      - postgres
      - redis
    networks:
      - mantrapath-network

  # Profile Service
  profile-service:
    build:
      context: .
      dockerfile: services/profile/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - mantrapath-network

  # Mood Service
  mood-service:
    build:
      context: .
      dockerfile: services/mood/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - mantrapath-network

  # Chatbot Service
  chatbot-service:
    build:
      context: .
      dockerfile: services/chatbot/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - mantrapath-network

  # Content Service
  content-service:
    build:
      context: .
      dockerfile: services/content/Dockerfile
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - mantrapath-network

  # Community Service
  community-service:
    build:
      context: .
      dockerfile: services/community/Dockerfile
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - mantrapath-network

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - mantrapath-network

  # Media Service
  media-service:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    ports:
      - "8009:8009"
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - mantrapath-network

volumes:
  postgres_data:

networks:
  mantrapath-network:
    driver: bridge