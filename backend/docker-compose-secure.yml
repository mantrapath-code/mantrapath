# Secure Docker Compose Configuration
# This configuration removes all direct microservice port exposures
# All traffic MUST go through the API Gateway for security

services:
  # Database - Only accessible internally
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mantrapath
      POSTGRES_USER: mantrapath
      POSTGRES_PASSWORD: mantrapath123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    # NO EXTERNAL PORT EXPOSURE - Only accessible from within Docker network
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mantrapath -d mantrapath"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis - Only accessible internally
  redis:
    image: redis:7-alpine
    # NO EXTERNAL PORT EXPOSURE - Only accessible from within Docker network
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # API Gateway - ONLY service with external port exposure
  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
      - "8000:8000"  # ONLY external port - all traffic goes through here
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      # Internal service URLs - not accessible from outside
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PROFILE_SERVICE_URL=http://profile-service:8002
      - MOOD_SERVICE_URL=http://mood-service:8003
      - CHATBOT_SERVICE_URL=http://chatbot-service:8004
      - CONTENT_SERVICE_URL=http://content-service:8005
      - COMMUNITY_SERVICE_URL=http://community-service:8006
      - NOTIFICATION_SERVICE_URL=http://notification-service:8007
      - ML_SERVICE_URL=http://ml-service:8008
      - MEDIA_SERVICE_URL=http://media-service:8009
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      profile-service:
        condition: service_started
      mood-service:
        condition: service_started
      chatbot-service:
        condition: service_started
      content-service:
        condition: service_started
      community-service:
        condition: service_started
      notification-service:
        condition: service_started
      ml-service:
        condition: service_started
      media-service:
        condition: service_started
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Auth Service - INTERNAL ONLY
  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    # NO PORT EXPOSURE - Only accessible through API Gateway
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      - APP_URL=${APP_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Profile Service - INTERNAL ONLY
  profile-service:
    build:
      context: .
      dockerfile: services/profile_service/Dockerfile
    # NO PORT EXPOSURE - Only accessible through API Gateway
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Mood Service - INTERNAL ONLY
  mood-service:
    build:
      context: .
      dockerfile: services/mood_service/Dockerfile
    # NO PORT EXPOSURE - Only accessible through API Gateway
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Phi-3 Mini Agent Service - INTERNAL ONLY
  phi3-agent:
    image: vllm/vllm-openai:latest
    container_name: mantrapath_phi3_agent
    environment:
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_LOGGING_LEVEL=DEBUG
      - CUDA_VISIBLE_DEVICES=""
      - VLLM_USE_CPU=1
    # NO PORT EXPOSURE - Only accessible through internal network
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: [
      "--model", "microsoft/Phi-3-mini-4k-instruct",
      "--served-model-name", "phi3-mini",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--max-model-len", "4096",
      "--trust-remote-code",
      "--tensor-parallel-size", "1",
      "--max-num-seqs", "16",
      "--disable-log-requests",
      "--device", "cpu",
      "--dtype", "float32"
    ]
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 180s
    networks:
      - mantrapath-network

  # Agent Redis - INTERNAL ONLY
  agent-redis:
    image: redis:7-alpine
    container_name: mantrapath_agent_redis
    # NO PORT EXPOSURE - Only accessible through internal network
    volumes:
      - agent_redis_data:/data
    restart: unless-stopped
    networks:
      - mantrapath-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Chatbot Service - INTERNAL ONLY
  chatbot-service:
    build:
      context: .
      dockerfile: services/chatbot_service/Dockerfile
    # NO PORT EXPOSURE - Only accessible through API Gateway
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - AGENT_REDIS_URL=redis://agent-redis:6379
      - PHI3_AGENT_URL=http://phi3-agent:8000/v1/chat/completions
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-api-key-here}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Content Service - INTERNAL ONLY
  content-service:
    build:
      context: .
      dockerfile: services/content_service/Dockerfile
    # NO PORT EXPOSURE - Only accessible through API Gateway
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Community Service - INTERNAL ONLY
  community-service:
    build:
      context: .
      dockerfile: services/community_service/Dockerfile
    # NO PORT EXPOSURE - Only accessible through API Gateway
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Notification Service - INTERNAL ONLY
  notification-service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    # NO PORT EXPOSURE - Only accessible through API Gateway
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ML Service - INTERNAL ONLY
  ml-service:
    build:
      context: .
      dockerfile: services/ml_service/Dockerfile
    # NO PORT EXPOSURE - Only accessible through API Gateway
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - AGENT_REDIS_URL=redis://agent-redis:6379
      - PHI3_AGENT_URL=http://phi3-agent:8000/v1/chat/completions
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Media Service - INTERNAL ONLY
  media-service:
    build:
      context: .
      dockerfile: services/media_service/Dockerfile
    # NO PORT EXPOSURE - Only accessible through API Gateway
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mantrapath:mantrapath123@postgres:5432/mantrapath
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mantrapath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Reverse Proxy for Production (Optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
    networks:
      - mantrapath-network
    restart: unless-stopped
    # Only include this service in production

volumes:
  postgres_data:
  agent_redis_data:

networks:
  mantrapath-network:
    driver: bridge
    # Isolate all services in a private network
    internal: false  # Allow external traffic only through exposed ports
